  --t-warn: #E8B04F; --t-crit: #F2857C; --t-good: #6CC593; --focus: #7FA6E6;
  --backdrop: rgba(0, 0, 0, .6); --lift: 0 18px 50px rgba(0, 0, 0, .5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #101613; --sheet: #171E1A; --field: #1C2420; --hover: #212A25;
    --rule: #28322D; --rule-2: #3A4741;
    --ink: #E3EAE4; --ink-2: #B0BCB4; --muted: #87948C;
    --data: #5A8AD8; --pace: #6F7C75; --warn: #D99A2B; --crit: #E2615A; --good: #4FAE77;
    --t-warn: #E8B04F; --t-crit: #F2857C; --t-good: #6CC593; --focus: #7FA6E6;
    --backdrop: rgba(0, 0, 0, .6); --lift: 0 18px 50px rgba(0, 0, 0, .5);
  }
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 400 14px/1.45 var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--data); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.ico { font-family: var(--emoji); font-size: 15px; line-height: 1; width: 20px; display: inline-block; text-align: center; flex: none; }
.num, .tbl td.num, .tabnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.t-crit { color: var(--t-crit); } .t-warn { color: var(--t-warn); } .t-good { color: var(--t-good); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--sheet); padding: 8px 12px; border-radius: 6px; z-index: 100; }
.skip:focus { left: 8px; }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--rule-2);
  background: var(--field); color: var(--ink); font-weight: 500; font-size: 13.5px; line-height: 1;
  cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 88%, var(--data)); }
.btn.danger { color: var(--t-crit); }
.btn.danger-fill { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
.btn svg { width: 16px; height: 16px; }
.link { border: 0; background: none; padding: 0; color: var(--data); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 18px; line-height: 1;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], input:not([type]), select, textarea {
  height: 34px; padding: 0 10px; border: 1px solid var(--rule-2); border-radius: 7px; background: var(--field);
  min-width: 0;
}
select { padding-right: 6px; }
input::placeholder { color: var(--muted); opacity: 1; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
label.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

.seg { display: inline-flex; background: var(--page); border: 1px solid var(--rule); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 28px; border-radius: 7px; color: var(--ink-2); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-2); }

/* ---------- header ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--rule); padding-top: env(safe-area-inset-top); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 22px; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15.5px; letter-spacing: -.005em; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; color: var(--ink); }
.tabs { display: flex; gap: 4px; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; border-radius: 7px; }
.tab:hover { color: var(--ink); background: var(--hover); }
.tab[aria-current="page"] { color: var(--ink); background: var(--sheet); box-shadow: 0 0 0 1px var(--rule); }
.tab svg { display: none; width: 20px; height: 20px; }
.month-nav { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; }
.month-label { border: 0; background: transparent; padding: 0 8px; height: 32px; border-radius: 7px; font-weight: 600; cursor: pointer; min-width: 128px; text-align: center; white-space: nowrap; }
.month-label:hover { background: var(--hover); }
.month-label .short { display: none; }
.fab { display: none; }

/* ---------- page ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 80px; outline: none; }
#banners:empty { display: none; }
#banners { max-width: 1240px; margin: 14px auto 0; padding: 0 20px; display: grid; gap: 8px; }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--rule-2); background: var(--sheet); }
.banner p { flex: 1 1 320px; }
.banner.crit { border-color: color-mix(in srgb, var(--crit) 55%, var(--rule)); background: color-mix(in srgb, var(--crit) 7%, var(--sheet)); }
.banner .banner-actions { display: flex; gap: 6px; }
.view-head { margin-bottom: 16px; }
.view-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.view-head .lede { color: var(--ink-2); margin-top: 3px; max-width: 70ch; }

.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px 16px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.panel-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.panel-head .aside { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.panel > h2 { margin-bottom: 10px; }
.panel p + p { margin-top: 8px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

/* ---------- overview ---------- */
.ov { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.ov-main, .ov-side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }

.hero { padding: 2px 0 2px; }
.hero-top { display: flex; align-items: baseline; gap: 12px; color: var(--ink-2); }
.hero-top .day { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.hero-figure { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
.hero-num {
  font-size: 46px; line-height: 1.05; font-weight: 600; letter-spacing: -.02em; color: var(--ink);
  padding-bottom: 4px; border-bottom: 3px double var(--ink);
}
.hero-num.over { color: var(--t-crit); border-bottom-color: var(--t-crit); }
.hero-word { font-size: 17px; color: var(--ink-2); }
.hero-sub { margin-top: 12px; color: var(--ink-2); max-width: 64ch; }
.hero-sub b { color: var(--ink); font-weight: 600; }
.limit-inline { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.money-in { display: inline-flex; align-items: center; border: 1px solid var(--rule-2); border-radius: 7px; background: var(--field); height: 34px; padding-left: 10px; }
.money-in > span { color: var(--muted); }
.money-in input { border: 0; height: 32px; width: 110px; background: transparent; padding: 0 8px; }
.money-in input:focus-visible { outline: none; }
.money-in:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }

.meter { position: relative; height: 12px; background: var(--wash); border-radius: 6px; margin: 18px 0 10px; }
.meter > .seg-spent, .meter > .seg-bills { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.meter > .seg-spent { left: 0; background: var(--data); }
.meter > .seg-bills { background: var(--wash-2); }
.meter.warn > .seg-spent { background: var(--warn); }
.meter.over > .seg-spent { background: var(--crit); }
.meter > .tick { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; box-shadow: 0 0 0 2px var(--page); }
.meter-key { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12.5px; color: var(--ink-2); }
.meter-key span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--data); flex: none; }
.sw.bills { background: var(--wash-2); }
.sw.warn { background: var(--warn); } .sw.over { background: var(--crit); }
.sw.tick { width: 2px; height: 12px; border-radius: 1px; background: var(--ink); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; }
.kpi { padding: 12px 14px 13px; border-left: 1px solid var(--rule); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi-label { font-size: 12.5px; color: var(--ink-2); }
.kpi-value { font-size: 20px; font-weight: 600; margin-top: 3px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi-sub.t-crit, .kpi-sub.t-warn, .kpi-sub.t-good { font-weight: 500; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-line { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--data); }
.k-line.pace { border-top: 1.5px solid var(--pace); }
.k-line.inc { border-top-color: var(--good); }
.k-line.limit { border-top: 1px solid var(--ink-2); }
.k-dash { display: inline-block; width: 16px; height: 0; border-top: 2px dotted var(--data); }
.k-dash.inc { border-top-color: var(--good); }
.k-bar { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--data); }
.k-bar.proj { background: var(--wash-2); }

.chart { position: relative; min-height: 200px; }
.table-view { margin-top: 8px; font-size: 13px; }
.table-view summary { cursor: pointer; color: var(--ink-2); width: max-content; }
.table-view[open] summary { margin-bottom: 8px; }
.table-scroll { position: relative; max-height: 320px; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; }

/* category meters */
.cat-list { display: grid; grid-template-columns: minmax(0, 1fr); }
.cat-row { display: grid; grid-template-columns: minmax(150px, 210px) minmax(80px, 1fr) minmax(150px, 190px); gap: 14px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); }
.cat-row:first-child { border-top: 0; padding-top: 2px; }
.cat-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cat-name > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--wash); }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--data); }
.bar.warn > i { background: var(--warn); }
.bar.over > i { background: var(--crit); }
.bar > s { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--wash-2); text-decoration: none; }
.bar > b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; box-shadow: 0 0 0 2px var(--sheet); }
.bar.none { background: transparent; border-top: 1px dashed var(--rule-2); height: 0; border-radius: 0; }
.cat-fig { text-align: right; font-variant-numeric: tabular-nums; line-height: 1.3; }
.cat-fig .of { color: var(--muted); }
.cat-state { display: block; font-size: 12px; color: var(--muted); }
.cat-state.t-crit, .cat-state.t-warn { font-weight: 500; }
.cat-total { display: grid; grid-template-columns: 1fr auto; padding: 9px 0 6px; border-top: 1px solid var(--rule-2); font-weight: 600; }
.cat-total > span:last-child { border-bottom: 3px double var(--rule-2); padding-bottom: 2px; font-variant-numeric: tabular-nums; }
.cat-foot { margin-top: 10px; font-size: 12.5px; color: var(--muted); }

/* notes / insights */
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.notes li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start; }
.notes svg { width: 16px; height: 16px; margin-top: 2px; }
.notes .i-crit { color: var(--crit); } .notes .i-warn { color: var(--warn); } .notes .i-good { color: var(--good); } .notes .i-info { color: var(--pace); }
.notes b { font-weight: 600; }

/* small ledgers in the side column */
.mini { display: grid; grid-template-columns: minmax(0, 1fr); }
.mini-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--rule); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; cursor: pointer; }
.mini-row:first-child { border-top: 0; }
.mini-row:hover .mini-note { text-decoration: underline; text-decoration-color: var(--rule-2); }
.mini-note { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-date { color: var(--muted); font-size: 12px; display: block; }
.mini-amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini-amt.in { color: var(--t-good); }
.mini-row.excluded .mini-amt, .mini-row.excluded .mini-note { color: var(--muted); }
.panel-foot { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.welcome h2 { font-size: 18px; margin-bottom: 6px; }
.welcome p { color: var(--ink-2); max-width: 62ch; }
.welcome ol { margin: 14px 0 0; padding-left: 20px; color: var(--ink-2); display: grid; gap: 4px; }
.welcome .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.narrow-only { display: none; }

/* ---------- entry form ---------- */
.entry-panel h2 { margin-bottom: 12px; }
form.entry { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.entry-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.entry-top input[type="date"] { width: 150px; }
.amount-line { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--ink); padding: 0 2px 2px; }
.amount-line .cur { font-size: 22px; color: var(--muted); font-weight: 500; }
.amount-line input { border: 0; background: transparent; font-size: 30px; font-weight: 600; height: 46px; padding: 0; width: 100%; letter-spacing: -.01em; }
.amount-line input:focus-visible { outline: none; }
.amount-line:focus-within { border-bottom-color: var(--focus); box-shadow: 0 2px 0 var(--focus); }
form.entry .note-in { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 0 9px 0 6px; height: 30px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--field); font-size: 13px; color: var(--ink); cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--rule-2); }
.chip .ico { font-size: 14px; width: 18px; }
.chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.chip.auto[aria-checked="true"] { background: var(--sheet); color: var(--ink); border: 1px solid var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.refund { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; flex-wrap: wrap; }
.refund select { flex: 1; min-width: 160px; }
.form-error { color: var(--t-crit); font-weight: 500; font-size: 13px; }
.entry-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.entry-actions .btn.primary { min-width: 120px; }
.entry-actions .spacer { flex: 1; }
.entry-origin { font-size: 12.5px; color: var(--muted); }

/* ---------- entries ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.toolbar input[type="search"] { width: 200px; }
.toolbar select { max-width: 220px; }
.toggle { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--field); cursor: pointer; font-size: 13px; font-weight: 500; }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px 0 12px; border-radius: 8px; background: var(--wash); color: var(--ink); font-size: 13px; }
.pill .icon-btn { width: 26px; height: 26px; font-size: 16px; }
.summary-line { color: var(--ink-2); margin: 4px 0 12px; }
.summary-line b { color: var(--ink); font-weight: 600; }
.ledger { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.day-head { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 16px 6px; background: var(--page); border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 12.5px; font-weight: 500; }
.day:first-child .day-head { border-top: 0; }
.day-head .num { color: var(--muted); font-weight: 400; }
.tx { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(150px, 220px) 112px; gap: 12px; align-items: center; padding: 6px 16px; border-top: 1px solid var(--rule); }
.day-head + .tx { border-top: 0; }
.tx-main { display: grid; text-align: left; border: 0; background: none; padding: 2px 0; cursor: pointer; min-width: 0; color: inherit; }
.tx-main:hover .tx-note { text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 2px; }
.tx-note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-note.empty { color: var(--muted); }
.tx-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-cat { height: 30px; width: 100%; font-size: 13px; background: transparent; border-color: transparent; color: var(--ink-2); }
.tx-cat:hover, .tx-cat:focus-visible { border-color: var(--rule-2); background: var(--field); }
.tx-cat.needs { border-color: color-mix(in srgb, var(--warn) 60%, var(--rule)); color: var(--t-warn); background: color-mix(in srgb, var(--warn) 8%, transparent); }
.tx-amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx-amt.in { color: var(--t-good); }
.tx.excluded .tx-amt { color: var(--muted); }
.ledger-total { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px 16px 12px; border-top: 1px solid var(--rule-2); font-weight: 600; }
.ledger-total .num { border-bottom: 3px double var(--rule-2); padding-bottom: 2px; }
.more { display: flex; justify-content: center; padding: 12px; border-top: 1px solid var(--rule); }
.empty-state { padding: 34px 20px; text-align: center; color: var(--ink-2); }
.empty-state p + .actions, .empty-state .actions { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ---------- tables ---------- */
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; vertical-align: bottom; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.tbl th.num, .tbl td.num { text-align: right; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tfoot td { border-top: 1px solid var(--rule-2); font-weight: 600; padding-top: 8px; border-bottom: 0; }
.tbl tfoot td.num span { border-bottom: 3px double var(--rule-2); padding-bottom: 2px; }
.tbl .cell-name { display: flex; align-items: center; gap: 8px; }
.tbl-wrap { position: relative; overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.heat td.v { position: relative; }
.heat td.v.over::after { content: "▲"; font-size: 8px; color: var(--crit); position: relative; top: -5px; margin-left: 2px; }
.heat td.v.over { color: var(--t-crit); font-weight: 600; }

/* budgets */
.budget-tbl input.name-in { width: 100%; min-width: 120px; border-color: transparent; background: transparent; padding: 0 6px; }
.budget-tbl input.icon-in { width: 40px; text-align: center; padding: 0; font-family: var(--emoji); border-color: transparent; background: transparent; }

<script>
(() => {
'use strict';
/* =========================================================================
   Helpers: DOM, escaping, dates (local calendar days as 'YYYY-MM-DD'),
   money formatting and parsing.
   ========================================================================= */
const STORE_KEY = 'spend-control/v1';
const DAY_MS = 86400000;

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sumBy = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const pad2 = n => String(n).padStart(2, '0');
const plural = (n, one, many = one + 's') => `${n.toLocaleString('en-GB')} ${n === 1 ? one : many}`;
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- dates ---------- */
const ymd = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
const splitYMD = s => s.split('-').map(Number);
const daysIn = (y, m) => new Date(y, m, 0).getDate();           // m is 1-based
function today() { const d = new Date(); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
const monthKey = s => s.slice(0, 7);
function monthLen(mk) { const [y, m] = splitYMD(mk); return daysIn(y, m); }
function shiftMonth(mk, n) { const [y, m] = splitYMD(mk); const t = y * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${pad2((t % 12) + 1)}`; }
function addDays(s, n) { const [y, m, d] = splitYMD(s); const dt = new Date(y, m - 1, d + n); return ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }
function toDate(s) { const [y, m, d] = splitYMD(s); return new Date(y, m - 1, d); }
function isYMD(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = splitYMD(s);
  return y >= 1970 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= daysIn(y, m);
}
function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / DAY_MS); }

const DF = {
  day: new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
  dayYear: new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
  dayLong: new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }),
  dm: new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' }),
  month: new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' }),
  monthShort: new Intl.DateTimeFormat('en-GB', { month: 'short', year: 'numeric' }),
  monthName: new Intl.DateTimeFormat('en-GB', { month: 'long' }),
  mon: new Intl.DateTimeFormat('en-GB', { month: 'short' }),
};
const fmtDay = s => DF.day.format(toDate(s));
const fmtDM = s => DF.dm.format(toDate(s));
const fmtDayYear = s => DF.dayYear.format(toDate(s));
const fmtMonth = mk => DF.month.format(toDate(mk + '-01'));
const fmtMonthShort = mk => DF.monthShort.format(toDate(mk + '-01'));
const fmtMonthName = mk => DF.monthName.format(toDate(mk + '-01'));
const fmtMon = mk => DF.mon.format(toDate(mk + '-01'));
/* A date in the year of today is shown without the year. */
const fmtDayAuto = s => (s.slice(0, 4) === today().slice(0, 4) ? fmtDay(s) : fmtDayYear(s));

/* ---------- money ---------- */
const nfCache = new Map();
function nf(opts) {
  const s = state.settings;
  const key = s.locale + '|' + s.currency + '|' + JSON.stringify(opts);
  let f = nfCache.get(key);

/* ---------- auto-categorize ---------- */

      s.tx.push({ id, date: occ, amount: r.amount, type: r.type, cat: r.cat, note: r.note, src: r.src === 'demo' ? 'demo' : 'recurring', rid: r.id, created: stamp + created });

    const sd = spendDelta(t.type, t.amount, c), id = incomeDelta(t.type, t.amount, c);
    const day = +t.date.slice(8);
    if (sd) {

      byCat.set(c.id, (byCat.get(c.id) || 0) + sd);
      if (t.rid) { recurSpent += sd; recurDaily[day] += sd; recurByCat.set(c.id, (recurByCat.get(c.id) || 0) + sd); }

/* One row per spending category: spent, budget, expected-by-today, projection, state. */
function categoryRows(st) {
  const rows = [];

    if (c.kind !== 'expense' && c.kind !== 'auto') continue;
    const spent = st.byCat.get(c.id) || 0;
    const budget = c.kind === 'expense' ? c.budget : null;
    const up = st.upByCat.get(c.id) || 0;
    if (!spent && !budget && !up) continue;
    const recur = st.recurByCat.get(c.id) || 0;
    let expected = null, projected = null;
    if (st.status === 'current') {
      if (budget) expected = recur + Math.max(0, budget - recur - up) * st.dayNum / st.days;
      if (st.projectionReady) projected = Math.round(spent + up + Math.max(0, (spent - recur) / st.dayNum) * st.daysLeft);
    } else if (st.status === 'past') { expected = budget; projected = spent; }
    else { projected = spent + up; }
    let state_ = 'none';
    if (budget) {
      if (spent > budget) state_ = 'over';
      else if (spent + up > budget || (st.status === 'current' && st.dayNum >= 5 && projected != null && projected > budget)) state_ = 'warn';

/* ---------- toasts ---------- */
function toast(msg, actions = []) {
  const root = $('#toasts');
  // An open dialog blocks everything outside it, so messages move inside it to stay usable.
  const dialogs = $$('dialog[open]'), host = dialogs[dialogs.length - 1] || document.body;
  if (root.parentElement !== host) host.append(root);
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  const span = document.createElement('span');
  span.textContent = msg;
  el.append(span);
  let timer;
  const dismiss = () => { clearTimeout(timer); el.remove(); };
  for (const a of actions) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toast-btn'; b.textContent = a.label;
    b.addEventListener('click', () => { dismiss(); a.run(); });
    el.append(b);
  }
  root.append(el);
  while (root.children.length > 3) root.firstElementChild.remove();
  timer = setTimeout(dismiss, actions.length ? 8000 : 4000);
  el.addEventListener('pointerenter', () => clearTimeout(timer));
  el.addEventListener('pointerleave', () => { timer = setTimeout(dismiss, 3000); });
  return dismiss;
}

  commit(s => s.tx.push(entry), `${verb} ${money(cents)} in ${c.name}${when}.`);
  if (ctx === 'inline') $('[data-key="inline-amount"]')?.focus();
};
ACT['entry-delete'] = el => {

ACT['edit-tx'] = el => { const t = state.tx.find(x => x.id === el.dataset.id); if (t) openEntryModal(t); };

function heroHTML(st) {
  const L = st.limit, mn = fmtMonthName(st.mk);
  const dayInfo = st.status === 'current' ? `Day ${st.dayNum} of ${st.days}` : st.status === 'past' ? 'Closed month' : 'Upcoming month';
  let figure, sub, extra;
  if (L) {
    if (st.status === 'current') {
      const left = L - st.spent - st.upSpend, daysIncl = st.daysLeft + 1;
      if (left >= 0) {
        figure = `<span class="hero-num">${money(left)}</span><span class="hero-word">left to spend in ${mn}</span>`;
        sub = `That's about <b>${money(Math.floor(left / daysIncl))} a day</b> for ${daysIncl === 1 ? 'today, the last day' : `the ${daysIncl} days left, today included`}${st.upSpend ? `, after ${money(st.upSpend)} of recurring payments still to come` : ''}.`;
      } else {
        figure = `<span class="hero-num over">${money(-left)}</span><span class="hero-word">over your limit in ${mn}</span>`;
        sub = st.spent > L
          ? `You've spent ${money(st.spent)} against a limit of ${money(L)}${st.upSpend ? `, and ${money(st.upSpend)} of recurring payments are still to come` : ''}.`
          : `You've spent ${money(st.spent)}. The ${money(st.upSpend)} of recurring payments still to come will take you past your ${money(L)} limit.`;
      }
    } else if (st.status === 'past') {
      const left = L - st.spent;
      figure = left >= 0
        ? `<span class="hero-num">${money(left)}</span><span class="hero-word">under your limit in ${mn}</span>`
        : `<span class="hero-num over">${money(-left)}</span><span class="hero-word">over your limit in ${mn}</span>`;
      sub = `You spent ${money(st.spent)} of ${money(L)}${st.income ? ` and took in ${money(st.income)}` : ''}.`;
    } else {
      figure = `<span class="hero-num">${money(L - st.upSpend)}</span><span class="hero-word">free to spend in ${mn}</span>`;
      sub = st.upSpend ? `${money(st.upSpend)} of your ${money(L)} limit is already set aside for recurring payments.` : `Your limit is ${money(L)}.`;
    }
    extra = meterHTML(st);
  } else {
    figure = `<span class="hero-num">${money(st.spent)}</span><span class="hero-word">spent in ${mn}${st.status === 'current' ? ' so far' : ''}</span>`;
    sub = 'Set a monthly limit to see how much is left and what you can spend each day.';
    extra = `<form class="limit-inline" data-form="limit-inline"><label class="money-in"><span>${esc(currencySymbol())}</span><input type="text" name="limit" inputmode="decimal" placeholder="Monthly limit" aria-label="Monthly limit" data-key="hero-limit"></label><button class="btn" type="submit">Set limit</button></form>`;
  }
  return `<section class="hero o-hero" aria-label="This month">
    <div class="hero-top"><span>${esc(fmtMonth(st.mk))}</span><span class="day">${dayInfo}</span></div>
    <div class="hero-figure">${figure}</div>
    <p class="hero-sub">${sub}</p>
    ${extra}
  </section>`;
}

function meterHTML(st) {
  const L = st.limit;
  const sp = clamp(st.spent / L, 0, 1);
  const bills = st.status === 'past' ? 0 : clamp((Math.max(0, st.spent) + st.upSpend) / L, 0, 1) - sp;
  const over = st.spent > L;
  const warn = !over && (st.spent + st.upSpend > L || (st.status === 'current' && st.projected != null && st.projected > L));
  const cls = over ? 'over' : warn ? 'warn' : '';
  const plan = st.status === 'current' && st.ideal ? st.ideal[st.dayNum] : null;
  const tick = plan != null ? clamp(plan / L, 0, 1) : null;
  const pct = Math.round(st.spent / L * 100);
  const aria = `Spent ${money(st.spent)} of ${money(L)}, ${pct}%.${plan != null ? ` Planned by today ${money(plan)}.` : ''}`;
  return `<div class="meter ${cls}" role="img" aria-label="${esc(aria)}">
      <span class="seg-spent" style="width:${(sp * 100).toFixed(2)}%"></span>
      ${bills > 0.004 ? `<span class="seg-bills" style="left:calc(${(sp * 100).toFixed(2)}% + 2px);width:calc(${(bills * 100).toFixed(2)}% - 2px)"></span>` : ''}
      ${tick != null ? `<span class="tick" style="left:${(tick * 100).toFixed(2)}%"></span>` : ''}
    </div>
    <div class="meter-key">
      <span><i class="sw ${cls}"></i>Spent ${money(st.spent)}, ${pct}% of ${money(L, { whole: L % 100 === 0 })}${st.limitExplicit ? '' : ' (your category budgets added up)'}</span>
      ${bills > 0.004 ? `<span><i class="sw bills"></i>Recurring still to come ${money(st.upSpend)}</span>` : ''}
      ${plan != null ? `<span><i class="sw tick"></i>Planned by today ${money(plan)}</span>` : ''}
    </div>`;
}

function kpisHTML(st) {
  const L = st.limit;
  const tile = (label, value, sub, subCls = '') => `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value" title="${esc(value)}">${value}</div><div class="kpi-sub ${subCls}">${sub}</div></div>`;
  const spentSub = L ? `${Math.round(st.spent / L * 100)}% of your limit` : plural(st.nExpense, 'expense');
  const incomeSub = st.status === 'future' ? (st.upIncome ? `${money(st.upIncome)} expected` : 'nothing scheduled') : (st.nIncome ? plural(st.nIncome, 'payment') : 'nothing yet');
  const netSub = st.net >= 0 ? 'income minus spending' : 'more went out than came in';
  let fourth;
  if (st.status === 'current') {
    if (st.projected == null) fourth = tile('Projected month total', '–', 'shown from the 3rd of the month');
    else {
      const p = st.projected;
      let sub = 'at your current pace', cls = '';
      if (L) { if (p > L) { sub = `${money(p - L, { whole: true })} over the limit at this pace`; cls = 't-crit'; } else { sub = `${money(L - p, { whole: true })} under the limit at this pace`; cls = 't-good'; } }
      fourth = tile('Projected month total', moneyRound(p), sub, cls);
    }
  } else if (st.status === 'past') {
    fourth = tile('Daily average', money(Math.round(st.spent / st.days)), `${plural(st.noSpendDays, 'day')} with no spending`);
  } else {
    fourth = tile('Recurring scheduled', money(st.upSpend), plural(st.upcoming.length, 'payment'));
  }
  return `<div class="kpis o-kpis">
    ${tile('Spent', moneyRound(st.spent), spentSub)}
    ${tile('Income', moneyRound(st.income), incomeSub)}
    ${tile(st.status === 'past' ? 'Saved' : 'Net so far', money(st.net, { sign: true }), netSub, st.net < 0 ? 't-crit' : '')}
    ${fourth}
  </div>`;
}

function catsPanelHTML(st) {
  const rows = st.catRows;
  if (!rows.length) {
    return `<section class="panel o-cats"><div class="panel-head"><h2>Categories</h2></div><p class="muted">No spending in ${esc(fmtMonthName(st.mk))} yet.</p></section>`;
  }
  const items = rows.map(r => {
    const c = r.c;
    let bar, fig, txt = '', cls = '';
    if (r.budget) {
      const w = clamp(r.spent / r.budget, 0, 1) * 100;
      const tick = st.status === 'current' && r.expected != null ? clamp(r.expected / r.budget, 0, 1) * 100 : null;
      const upW = st.status === 'past' ? 0 : clamp((Math.max(0, r.spent) + r.up) / r.budget, 0, 1) * 100 - w;
      bar = `<div class="bar ${r.state === 'over' ? 'over' : r.state === 'warn' ? 'warn' : ''}" role="img" aria-label="${esc(c.name)}: ${money(r.spent)} of ${money(r.budget)}${r.up ? `, ${money(r.up)} recurring still to come` : ''}"><i style="width:${w.toFixed(2)}%"></i>${upW > 0.4 ? `<s style="left:calc(${w.toFixed(2)}% + ${w > 0 ? 2 : 0}px);width:calc(${upW.toFixed(2)}% - ${w > 0 ? 2 : 0}px)"></s>` : ''}${tick != null ? `<b style="left:${tick.toFixed(2)}%"></b>` : ''}</div>`;
      fig = `${money(r.spent)} <span class="of">of ${money(r.budget, { whole: r.budget % 100 === 0 })}</span>`;
      if (r.state === 'over') { txt = `Over by ${money(r.spent - r.budget)}`; cls = 't-crit'; }
      else if (r.state === 'warn') {
        cls = 't-warn';
        if (r.spent + r.up > r.budget) txt = 'Recurring payments will push it over';
        else if (st.status === 'current' && r.projected != null && r.projected > r.budget) txt = `On pace for ${money(r.projected, { whole: true })}`;
        else txt = `${money(r.budget - r.spent)} left`;
      } else txt = r.up ? `${money(r.budget - r.spent - r.up)} left after ${money(r.up)} due` : `${money(r.budget - r.spent)} left`;
    } else if (c.kind === 'auto') {
      bar = '<div class="bar none" aria-hidden="true"></div>';

    } else {
      bar = '<div class="bar none" aria-hidden="true"></div>';
      fig = money(r.spent);
      txt = `<button class="link" data-act="set-budget" data-id="${esc(c.id)}">Set a budget</button>`;
    }
    return `<div class="cat-row"><div class="cat-name"><span class="ico" aria-hidden="true">${esc(c.icon)}</span><span>${esc(c.name)}</span></div>${bar}<div class="cat-fig">${fig}<span class="cat-state ${cls}">${txt}</span></div></div>`;
  }).join('');
  const budgetSum = sumBy(rows, r => r.budget || 0);
  return `<section class="panel o-cats">
    <div class="panel-head"><h2>Categories</h2><span class="aside">${st.status === 'current' ? 'The dark mark shows where each category should be by today' : 'Spent against budget'}</span></div>
    <div class="cat-list">${items}</div>
    <div class="cat-total"><span>All spending${budgetSum ? ` <span class="muted" style="font-weight:400">against ${money(budgetSum, { whole: budgetSum % 100 === 0 })} of budgets</span>` : ''}</span><span>${money(st.spent)}</span></div>
  </section>`;
}

/* ---------- what stands out ---------- */
function buildNotes(st) {
  const out = [];
  if (st.status === 'future') return out;
  for (const r of st.catRows) {
    if (r.state === 'over') out.push({ lvl: 'crit', html: `<b>${esc(r.c.name)}</b> is over budget by ${money(r.spent - r.budget)}.` });
  }
  for (const r of st.catRows) {
    if (r.state === 'warn' && st.status === 'current' && r.projected != null && r.projected > r.budget && r.spent + r.up <= r.budget) {
      out.push({ lvl: 'warn', html: `<b>${esc(r.c.name)}</b> is on pace for ${money(r.projected, { whole: true })} against a budget of ${money(r.budget, { whole: true })}.` });
    }
  }
  // Compare with the three months before this one.
  const prev = monthBuckets(shiftMonth(st.mk, -3), shiftMonth(st.mk, -1)).filter(b => b.n > 0);
  if (prev.length >= 2 && st.projectionReady) {
    const flagged = new Set(st.catRows.filter(r => r.state === 'over' || r.state === 'warn').map(r => r.c.id));
    const moves = [];
    for (const r of st.catRows) {
      if (r.c.kind !== 'expense' || flagged.has(r.c.id)) continue;
      const avg = sumBy(prev, b => b.byCat.get(r.c.id) || 0) / prev.length;
      const now = st.status === 'current' ? r.projected : r.spent;
      if (now == null || now <= 0 || avg < 1500) continue;
      const diff = now - avg;
      if (Math.abs(diff) < 2000) continue;
      if (diff > 0 && now > avg * 1.3 && r.state !== 'over') moves.push({ r, avg, now, diff, up: true });
      if (diff < 0 && now < avg * 0.7) moves.push({ r, avg, now, diff, up: false });
    }
    moves.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
    for (const m of moves.slice(0, 2)) {
      const pctTxt = Math.round(Math.abs(m.diff) / m.avg * 100);
      const verb = st.status === 'current' ? 'is heading for' : 'came to';
      const html = m.up
        ? `<b>${esc(m.r.c.name)}</b> ${verb} ${money(m.now, { whole: true })}, ${pctTxt}% more than your usual ${money(m.avg, { whole: true })}.`
        : `<b>${esc(m.r.c.name)}</b> ${verb} ${money(m.now, { whole: true })}, ${pctTxt}% less than your usual ${money(m.avg, { whole: true })}.`;
      out.push({ lvl: m.up ? 'warn' : 'good', html });
    }
  }
  const rv = reviewCount();
  if (rv) out.push({ lvl: 'warn', html: `${plural(rv, 'pair')} of entries may count the same money twice (a transfer between your accounts, or a payment entered twice). <button class="link" data-act="review-open">Check them</button>` });
  const uncat = st.txs.filter(t => t.cat === 'uncat').length;
  if (uncat) out.push({ lvl: 'info', html: `${plural(uncat, 'entry', 'entries')} this month ${uncat === 1 ? 'needs' : 'need'} a category. <button class="link" data-act="review-uncat">Sort them</button>` });
  const fixed = recurringMonthlySpend();
  if (fixed > 0 && st.limit) out.push({ lvl: 'info', html: `Recurring payments take about ${money(fixed, { whole: true })} a month, ${Math.round(fixed / st.limit * 100)}% of your limit.` });
  if (st.largest && st.largest.amount >= 2000) out.push({ lvl: 'info', html: `Largest expense: ${money(st.largest.amount)} for ${esc(st.largest.note || cat(st.largest.cat).name)} on ${esc(fmtDM(st.largest.date))}.` });
  if (st.status === 'current' && st.dayNum >= 5 && st.noSpendDays > 0) out.push({ lvl: 'good', html: `${plural(st.noSpendDays, 'day')} with no spending so far this month.` });
  const order = { crit: 0, warn: 1, good: 2, info: 3 };
  return out.sort((a, b) => order[a.lvl] - order[b.lvl]).slice(0, 6);
}
function notesHTML(st) {
  const notes = buildNotes(st);
  if (!notes.length) return '';
  return `<section class="panel o-notes"><h2>What stands out</h2><ul class="notes">${notes.map(n => `<li>${ICONS[n.lvl]}<span>${n.html}</span></li>`).join('')}</ul></section>`;
}

function upcomingHTML() {
  const t = today();
  const list = upcomingBetween(t, addDays(t, 30));
  if (!state.recurring.length) {
    return `<section class="panel o-upcoming"><h2>Coming up</h2><p class="muted">Add rent, phone and subscriptions as recurring payments. They're counted before they're due, so "left to spend" stays honest.</p><div class="panel-foot"><button class="btn sm" data-act="rec-new">Add a recurring payment</button></div></section>`;
  }
  const rows = list.slice(0, 6).map(u => {
    const c = cat(u.r.cat), inc = u.r.type === 'income';
    return `<button class="mini-row" data-act="rec-edit" data-id="${esc(u.r.id)}"><span class="ico" aria-hidden="true">${esc(c.icon)}</span><span class="mini-note">${esc(u.r.note || c.name)}<span class="mini-date">${esc(fmtDay(u.date))}</span></span><span class="mini-amt${inc ? ' in' : ''}">${money(inc ? u.r.amount : -u.r.amount, { sign: inc })}</span></button>`;
  }).join('');
  const total = sumBy(list, u => spendDelta(u.r.type, u.r.amount, cat(u.r.cat)));
  return `<section class="panel o-upcoming"><div class="panel-head"><h2>Coming up</h2><span class="aside">next 30 days</span></div>
    ${rows ? `<div class="mini">${rows}</div>` : '<p class="muted">Nothing due in the next 30 days.</p>'}
    <div class="panel-foot">${total > 0 ? `<span class="muted">${money(total)} of spending due</span>` : ''}<a class="link" href="#budgets" style="margin-left:auto">Manage recurring</a></div>
  </section>`;
}

function latestHTML(st) {
  const list = [...st.txs].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created).slice(0, 6);
  const rows = list.map(t => {
    const c = cat(t.cat), inc = t.type === 'income', excluded = c.kind === 'transfer';
    return `<button class="mini-row${excluded ? ' excluded' : ''}" data-act="edit-tx" data-id="${esc(t.id)}"><span class="ico" aria-hidden="true">${esc(c.icon)}</span><span class="mini-note">${esc(t.note || c.name)}<span class="mini-date">${esc(fmtDay(t.date))}${excluded ? ', not counted' : ''}</span></span><span class="mini-amt${inc && !excluded ? ' in' : ''}">${money(inc ? t.amount : -t.amount, { sign: inc })}</span></button>`;
  }).join('');
  return `<section class="panel o-latest"><div class="panel-head"><h2>Latest in ${esc(fmtMonthName(st.mk))}</h2></div>
    ${rows ? `<div class="mini">${rows}</div>` : '<p class="muted">No entries this month.</p>'}
    <div class="panel-foot"><a class="link" href="#entries">See all entries</a></div>
  </section>`;
}

        <option value="income"${f.type === 'income' ? ' selected' : ''}>Money in</option>

      ${state.accounts.length ? `<select data-change="f-acct" data-key="f-acct" aria-label="Account"><option value="">All accounts</option>${state.accounts.map(a => `<option value="${esc(a.id)}"${a.id === f.acct ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}</select>` : ''}
      ${needsCount || f.needs ? `<button type="button" class="toggle" aria-pressed="${f.needs}" data-act="f-needs" data-key="f-needs">Needs a category (${needsCount})</button>` : ''}
      ${rvCount ? `<button type="button" class="toggle attn" data-act="review-open" data-key="f-review">Check double counting (${rvCount})</button>` : ''}
      ${batch ? `<span class="pill">From ${esc(batch.file)}<button class="icon-btn" data-act="f-batch-clear" aria-label="Show all entries, not just this import">×</button></span>` : ''}
    </div>`;

    if (!state.tx.length) {
      return `<div class="view-head"><h1>Entries</h1></div>
        <div class="ledger"><div class="empty-state"><p>No entries yet. Add your first one, or import a bank statement to fill in past months.</p>
        <div class="actions"><button class="btn primary" data-act="add-entry">Add entry</button><button class="btn" data-act="import-start">Import a statement</button></div></div></div>`;
    }

    let body;
    if (!all.length) {
      const filtered = f.q || f.cat || f.type || f.needs || f.batch || f.acct;
      body = `<div class="ledger"><div class="empty-state"><p>${filtered ? 'Nothing matches these filters.' : `No entries in ${esc(fmtMonth(ui.month))}.`}</p>
        <div class="actions">${filtered ? '<button class="btn" data-act="f-clear">Clear filters</button>' : ''}${f.scope === 'month' ? '<button class="btn" data-act="f-scope" data-v="all">Show all time</button>' : ''}</div></div></div>`;
    } else {
      const groups = [];
      for (const t of shown) {
        const g = groups[groups.length - 1];
        if (g && g.date === t.date) g.items.push(t); else groups.push({ date: t.date, items: [t] });
      }
      const dayHtml = groups.map(g => {
        const daySpend = sumBy(g.items, t => spendDelta(t.type, t.amount, cat(t.cat)));
        return `<div class="day"><div class="day-head"><span>${esc(fmtDayAuto(g.date))}</span><span class="num">${daySpend ? `spent ${money(daySpend)}` : ''}</span></div>${g.items.map(txRowHTML).join('')}</div>`;
      }).join('');
      const more = all.length > shown.length ? `<div class="more"><button class="btn" data-act="f-more">Show ${Math.min(200, all.length - shown.length)} more of ${plural(all.length - shown.length, 'remaining entry', 'remaining entries')}</button></div>` : '';
      body = `<div class="ledger">${dayHtml}${more}<div class="ledger-total"><span>${f.scope === 'all' ? 'All time' : esc(fmtMonth(ui.month))}${all.length !== scopeTx.length ? ', filtered' : ''}</span><span class="num">Spent ${money(spent)}${income ? `, income ${money(income)}` : ''}</span></div></div>`;
    }
    return `<div class="view-head"><h1>Entries</h1></div>${toolbar}
      <p class="summary-line">${plural(all.length, 'entry', 'entries')}. Spent <b>${money(spent)}</b>${income ? `, income <b>${money(income)}</b>` : ''}.</p>
      ${body}`;
  },
};

function filteredTx() {
  const f = ui.f, q = norm(f.q);
  return state.tx.filter(t => {
    if (f.batch) { if (t.batch !== f.batch) return false; }
    else if (f.scope === 'month' && monthKey(t.date) !== ui.month) return false;
    if (f.needs && t.cat !== 'uncat') return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.acct && t.acct !== f.acct) return false;
    if (f.type && t.type !== f.type) return false;
    if (q && !norm(t.note + ' ' + cat(t.cat).name).includes(q)) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
}

function txRowHTML(t) {
  const c = cat(t.cat), inc = t.type === 'income';
  const counted = spendDelta(t.type, t.amount, c) !== 0 || incomeDelta(t.type, t.amount, c) !== 0;
  let sub = '';
  if (c.kind === 'transfer') sub = 'Not counted';
  else if (inc && c.kind === 'expense') sub = 'Refund';
  if (t.rid) sub = sub ? sub + ', recurring' : 'Recurring';
  else if (t.src === 'import') sub = sub ? sub + ', imported' : 'Imported';
  const an = t.acct ? (state.accounts.find(a => a.id === t.acct) || {}).name : '';
  if (an) sub = sub ? `${sub}, ${an}` : an;
  return `<div class="tx${counted ? '' : ' excluded'}">
    <span class="ico" aria-hidden="true">${esc(c.icon)}</span>
    <button type="button" class="tx-main" data-act="edit-tx" data-id="${esc(t.id)}" aria-label="Edit ${esc(t.note || c.name)}, ${money(t.amount)}"><span class="tx-note${t.note ? '' : ' empty'}">${esc(t.note || c.name)}</span>${sub ? `<span class="tx-sub">${esc(sub)}</span>` : ''}</button>
    <select class="tx-cat${t.cat === 'uncat' ? ' needs' : ''}" data-change="tx-cat" data-id="${esc(t.id)}" data-key="txcat-${esc(t.id)}" aria-label="Category">${catOptions(t.cat)}</select>
    <span class="tx-amt${inc ? ' in' : ''}">${money(inc ? t.amount : -t.amount, { sign: inc })}</span>
  </div>`;
}

ACT['f-scope'] = el => { ui.f.scope = el.dataset.v; ui.f.batch = ''; ui.f.show = 200; render(); };
ACT['f-needs'] = () => { ui.f.needs = !ui.f.needs; ui.f.show = 200; render(); };
ACT['f-more'] = () => { ui.f.show += 200; render(); };
ACT['f-batch-clear'] = () => { ui.f.batch = ''; render(); };
ACT['f-clear'] = () => { Object.assign(ui.f, { q: '', cat: '', type: '', acct: '', needs: false, batch: '', show: 200 }); render(); };
CHANGE['f-acct'] = el => { ui.f.acct = el.value; ui.f.show = 200; render(); };
INPUT['f-q'] = el => { ui.f.q = el.value; ui.f.show = 200; render(); };
CHANGE['f-cat'] = el => { ui.f.cat = el.value; ui.f.show = 200; render(); };
CHANGE['f-type'] = el => { ui.f.type = el.value; ui.f.show = 200; render(); };
CHANGE['tx-cat'] = el => {
  const t = state.tx.find(x => x.id === el.dataset.id);
  if (!t || t.cat === el.value) return;
  const to = el.value, c = cat(to), note = t.note;
  const extra = note ? [{ label: 'Always do this', run: () => openRuleModal(note, to) }] : [];
  setTimeout(() => commit(s => { const x = s.tx.find(y => y.id === t.id); if (x) x.cat = to; }, `Moved to ${c.name}.`, extra), 0);
};

/* ---------- "always file X under Y" ---------- */
function openRuleModal(desc, catId) {
  const kw = suggestKeyword(desc);
  const dlg = openModal({
    title: 'Make it a rule',
    body: `<form id="rule-form" data-form="rule-modal" class="stack">
      <p>Entries whose description contains this text will be filed under the category you pick, both when you import statements and when you type them.</p>
      <label class="field">Description contains<input type="text" name="match" value="${esc(kw)}" data-input="rule-preview" autofocus required maxlength="80"></label>
      <label class="field">File under<select name="cat" data-change="rule-preview">${catOptions(catId, { kinds: ['expense', 'income', 'transfer'] })}</select></label>
      <label class="check"><input type="checkbox" name="apply" checked> <span id="rule-apply-text"></span></label>
      <p class="note-box">From: ${esc(desc)}</p>
    </form>`,
    foot: '<button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" form="rule-form" class="btn primary">Create rule</button>',
  });
  updateRulePreview(dlg.querySelector('form'));
}
function rulePreviewTargets(match, catId) {
  return state.tx.filter(t => t.cat !== catId && t.note && textMatches(match, t.note) && !(cat(catId).kind === 'income' && t.type !== 'income'));
}
function updateRulePreview(form) {
  if (!form) return;
  const n = rulePreviewTargets(form.elements.match.value, form.elements.cat.value).length;
  const span = form.querySelector('#rule-apply-text');
  span.textContent = n ? `Also move ${plural(n, 'existing entry', 'existing entries')} that match` : 'No other existing entries match';
  form.elements.apply.disabled = !n;
}
INPUT['rule-preview'] = el => updateRulePreview(el.form);
CHANGE['rule-preview'] = el => updateRulePreview(el.form);
SUBMIT['rule-modal'] = form => {
  const match = form.elements.match.value.trim(), catId = form.elements.cat.value;
  if (!match) { form.elements.match.focus(); return; }
  const apply = form.elements.apply.checked && !form.elements.apply.disabled;
  const ids = new Set(apply ? rulePreviewTargets(match, catId).map(t => t.id) : []);
  form.closest('dialog')?.close('ok');
  commit(s => {
    s.rules.unshift({ id: uid(), match, cat: catId });
    for (const t of s.tx) if (ids.has(t.id)) t.cat = catId;
  }, `Rule created${ids.size ? ` and ${plural(ids.size, 'entry', 'entries')} moved` : ''}.`);
};

    }

    ui._months = ms;

    const complete = ms.filter(b => b.status === 'past' && b.n > 0).slice(-6);

      const avg = sumBy(complete, b => b.spent) / complete.length;

    return `<div class="view-head"><h1>Trends</h1><p class="lede">The twelve months up to ${esc(fmtMonth(end))}. Use the month switcher above to look further back.</p></div>

          <div class="chart" id="trend-chart"></div>
          <details class="table-view"><summary>Show as a table</summary><div class="table-scroll"><table class="tbl"><thead><tr><th>Month</th><th class="num">Spent</th><th class="num">Projected</th><th class="num">Income</th><th class="num">Net</th></tr></thead><tbody>${tableRows}</tbody></table></div></details>
        </section>
        ${matrixHTML(ms.slice(-6))}
        ${topPlacesHTML(end)}
      </div>`;
  },

function matrixHTML(ms) {
  const ids = new Set();
  for (const b of ms) for (const [id, v] of b.byCat) if (v) ids.add(id);
  for (const c of state.categories) if (c.kind === 'expense' && c.budget) ids.add(c.id);
  const months = ms.filter(b => b.status !== 'future');
  const withData = months.filter(b => b.n > 0);
  const rows = [...ids].map(id => {
    const c = cat(id);
    const vals = ms.map(b => b.byCat.get(id) || 0);
    const total = sumBy(vals, v => v);
    const avg = withData.length ? sumBy(withData, b => b.byCat.get(id) || 0) / withData.length : 0;
    return { c, vals, total, avg };
  }).filter(r => r.total || r.c.budget).sort((a, b) => b.total - a.total);
  if (!rows.length) return '';
  const head = ms.map(b => `<th class="num">${esc(fmtMon(b.mk))}${b.status === 'current' ? '<span class="sr"> (so far)</span>*' : ''}</th>`).join('');
  const body = rows.map(r => {
    const max = Math.max(...r.vals, 1);
    const cells = r.vals.map((v, i) => {
      if (ms[i].status === 'future') return '<td class="num muted"></td>';
      if (!v) return '<td class="num muted">–</td>';
      const over = r.c.budget && v > r.c.budget;
      const a = v > 0 ? Math.round(6 + 30 * v / max) : 0;
      return `<td class="num v${over ? ' over' : ''}" style="background:color-mix(in srgb, var(--data) ${a}%, transparent)"${over ? ` title="Over the ${esc(money(r.c.budget))} budget"` : ''}>${money(v, { whole: true })}</td>`;
    }).join('');
    return `<tr><td><span class="cell-name"><span class="ico" aria-hidden="true">${esc(r.c.icon)}</span>${esc(r.c.name)}</span></td>${cells}<td class="num">${money(Math.round(r.avg), { whole: true })}</td><td class="num muted">${r.c.budget ? money(r.c.budget, { whole: true }) : ''}</td></tr>`;
  }).join('');
  const totals = ms.map(b => `<td class="num">${b.status === 'future' ? '' : `<span>${money(b.spent, { whole: true })}</span>`}</td>`).join('');
  const avgAll = withData.length ? sumBy(withData, b => b.spent) / withData.length : 0;
  const hasCurrent = ms.some(b => b.status === 'current');
  return `<section class="panel">
    <div class="panel-head"><h2>Categories, last six months</h2><span class="aside">Stronger shading marks a category's bigger months. ▲ marks a month over budget.</span></div>
    <div class="tbl-wrap"><table class="tbl heat">
      <thead><tr><th>Category</th>${head}<th class="num">Average</th><th class="num">Budget</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td>All spending</td>${totals}<td class="num"><span>${money(Math.round(avgAll), { whole: true })}</span></td><td class="num">${budgetTotal() ? money(budgetTotal(), { whole: true }) : ''}</td></tr></tfoot>
    </table></div>
    ${hasCurrent ? '<p class="hint" style="margin-top:8px">* This month so far. Averages only count months that have entries.</p>' : '<p class="hint" style="margin-top:8px">Averages only count months that have entries.</p>'}
  </section>`;
}

function placeKey(note) {
  return norm(note).replace(/\d+/g, ' ').split(/[^\p{L}&]+/u)
    .filter(w => w && !/^(pos|αγορα|αγορεσ|purchase|card|καρτα|καρτασ|eft|eftpos)$/.test(w)).join(' ');
}
function topPlacesHTML(end) {
  const from = shiftMonth(end, -2) + '-01', to = end + '-31';
  const groups = new Map();
  let totalSpent = 0;
  for (const t of state.tx) {
    if (t.date < from || t.date > to) continue;
    const c = cat(t.cat);
    const sd = spendDelta(t.type, t.amount, c);
    totalSpent += sd;
    if (sd <= 0 || !t.note) continue;
    const k = placeKey(t.note);
    if (!k) continue;
    let g = groups.get(k);
    if (!g) { g = { label: t.note, labelDate: t.date, total: 0, n: 0, cats: new Map() }; groups.set(k, g); }
    g.total += sd; g.n++;
    g.cats.set(c.id, (g.cats.get(c.id) || 0) + sd);
    if (t.date >= g.labelDate) { g.label = t.note; g.labelDate = t.date; }
  }
  const top = [...groups.values()].sort((a, b) => b.total - a.total).slice(0, 10);
  if (!top.length) return '';
  const rows = top.map(g => {
    const cid = [...g.cats.entries()].sort((a, b) => b[1] - a[1])[0][0], c = cat(cid);
    const share = totalSpent > 0 ? Math.round(g.total / totalSpent * 100) : 0;
    return `<tr><td class="desc">${esc(g.label)}</td><td><span class="cell-name"><span class="ico" aria-hidden="true">${esc(c.icon)}</span>${esc(c.name)}</span></td><td class="num">${g.n}</td><td class="num">${money(g.total)}</td><td class="num">${share}%</td></tr>`;
  }).join('');
  return `<section class="panel">
    <div class="panel-head"><h2>Where the money went</h2><span class="aside">${esc(fmtMonthShort(shiftMonth(end, -2)))} to ${esc(fmtMonthShort(end))}, grouped by description</span></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Description</th><th>Category</th><th class="num">Times</th><th class="num">Total</th><th class="num">Share of spending</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </section>`;
}

      <div class="panel-head"><h2>Spending categories</h2><span class="aside">Edits save as soon as you leave a field</span></div>
      <div class="tbl-wrap"><table class="tbl budget-tbl">
        <thead><tr><th>Category</th><th class="num">Monthly budget</th><th class="num hide-sm">${mn}</th><th class="num hide-sm">3-month average</th><th></th></tr></thead>
        <tbody>${spendRows}</tbody><tfoot>${spendFoot}</tfoot>
      </table></div>
      ${addCatForm('expense')}
    </section>`;

    const otherPanels = `<div class="two-col">
      <section class="panel"><h2>Income categories</h2>
        <div class="tbl-wrap"><table class="tbl budget-tbl"><thead><tr><th>Category</th><th class="num hide-sm">${mn}</th><th class="num hide-sm">3-month average</th><th></th></tr></thead><tbody>${incRows || '<tr><td colspan="4" class="muted">None yet.</td></tr>'}</tbody></table></div>
        ${addCatForm('income')}
      </section>
      <section class="panel"><h2>Not counted</h2>
        <p class="hint" style="margin-bottom:8px">Money moving between your own accounts, savings, or cash you log separately. These never count as spending or income.</p>
        <div class="tbl-wrap"><table class="tbl budget-tbl"><thead><tr><th>Category</th><th class="num">${mn}</th><th></th></tr></thead><tbody>${trRows || '<tr><td colspan="3" class="muted">None yet.</td></tr>'}</tbody></table></div>
        ${addCatForm('transfer')}
      </section>
    </div>`;

    return `<div class="view-head"><h1>Budgets</h1><p class="lede">Set a monthly limit and what each category may take. Recurring payments are counted before they're due, so what's left stays honest.</p></div>
      <div class="stack">${limitPanel}${catsPanel}${recurringPanelHTML()}${otherPanels}</div>`;
  },
};

function catNameInputs(c) {
  return `<input type="text" class="icon-in" value="${esc(c.icon)}" maxlength="8" data-change="cat-icon" data-id="${esc(c.id)}" data-key="caticon-${esc(c.id)}" aria-label="Icon for ${esc(c.name)}"><input type="text" class="name-in" value="${esc(c.name)}" maxlength="60" data-change="cat-name" data-id="${esc(c.id)}" data-key="catname-${esc(c.id)}" aria-label="Name of ${esc(c.name)}">`;
}
function deleteCatBtn(c) {
  return `<button type="button" class="icon-btn" data-act="cat-delete" data-id="${esc(c.id)}" aria-label="Delete ${esc(c.name)}" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>`;
}
function addCatForm(kind) {
  const label = { expense: 'Add a spending category', income: 'Add an income category', transfer: 'Add a not-counted category' }[kind];
  return `<form class="add-row" data-form="cat-add" data-kind="${kind}" autocomplete="off">
    <input type="text" name="icon" maxlength="8" placeholder="🏷️" aria-label="Icon (an emoji)">
    <input type="text" name="name" maxlength="60" placeholder="${label}" aria-label="${label}">
    <button type="submit" class="btn sm">Add</button>
  </form>`;
}

function repeatsText(r) {
  const [y, m, d] = splitYMD(r.start);
  if (r.freq === 'weekly') return `Weekly on ${new Intl.DateTimeFormat('en-GB', { weekday: 'long' }).format(new Date(y, m - 1, d))}s`;
  if (r.freq === 'yearly') return `Yearly on ${fmtDM(r.start)}`;
  const sfx = (d % 10 === 1 && d !== 11) ? 'st' : (d % 10 === 2 && d !== 12) ? 'nd' : (d % 10 === 3 && d !== 13) ? 'rd' : 'th';
  return d >= 29 ? `Monthly on the ${d}${sfx} (or last day)` : `Monthly on the ${d}${sfx}`;
}
function recurringPanelHTML() {
  const list = [...state.recurring].sort((a, b) => (b.active - a.active) || (nextDue(a) || '9').localeCompare(nextDue(b) || '9'));
  const rows = list.map(r => {
    const c = cat(r.cat), inc = r.type === 'income', next = nextDue(r);
    return `<tr>
      <td><button type="button" class="link" data-act="rec-edit" data-id="${esc(r.id)}">${esc(r.note || c.name)}</button>${r.active ? '' : ' <span class="status-pill">Paused</span>'}</td>
      <td><span class="cell-name"><span class="ico" aria-hidden="true">${esc(c.icon)}</span>${esc(c.name)}</span></td>
      <td class="num${inc ? ' t-good' : ''}">${money(inc ? r.amount : -r.amount, { sign: inc })}</td>
      <td class="hide-sm">${esc(repeatsText(r))}</td>
      <td class="num">${r.active && next ? esc(fmtDayAuto(next)) : '<span class="muted">–</span>'}</td>
    </tr>`;
  }).join('');
  const fixed = recurringMonthlySpend();
  return `<section class="panel" id="recurring">
    <div class="panel-head"><h2>Recurring payments</h2><span class="aside">Added to your entries automatically on their dates</span></div>
    ${rows ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Description</th><th>Category</th><th class="num">Amount</th><th class="hide-sm">Repeats</th><th class="num">Next</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">None yet. Rent, phone, internet, gym and streaming are the usual ones.</p>'}
    <div class="panel-foot"><button class="btn sm" data-act="rec-new">Add a recurring payment</button>${fixed > 0 ? `<span class="muted" style="margin-left:auto">About ${money(fixed, { whole: true })} of spending a month</span>` : ''}</div>
  </section>`;
}

/* ---------- budget actions ---------- */
CHANGE['limit'] = el => {
  const raw = el.value.trim();
  if (!raw) { if (state.settings.limit) commit(s => { s.settings.limit = null; }, 'Monthly limit removed.'); return; }
  const v = parseAmount(raw);
  if (!Number.isFinite(v) || v <= 0) { toast('Enter a limit like 900 or 900,50.'); render(); return; }
  const cents = Math.round(v * 100);
  if (cents === state.settings.limit) return;
  setTimeout(() => commit(s => { s.settings.limit = cents; }, `Monthly limit set to ${money(cents)}.`), 0);
};
ACT['limit-from-sum'] = () => { const v = budgetTotal(); commit(s => { s.settings.limit = v; }, `Monthly limit set to ${money(v)}.`); };
CHANGE['cat-budget'] = el => {
  const c = catIndex.get(el.dataset.id);
  if (!c) return;
  const raw = el.value.trim();
  let cents = null;
  if (raw) {
    const v = parseAmount(raw);
    if (!Number.isFinite(v) || v < 0) { toast('Enter a budget like 120 or 120,50.'); render(); return; }
    cents = Math.round(v * 100) || null;
  }
  if (cents === c.budget) return;
  setTimeout(() => commit(s => { const x = s.categories.find(y => y.id === c.id); if (x) x.budget = cents; }, cents ? `${c.name} budget set to ${money(cents)}.` : `${c.name} budget removed.`), 0);
};
ACT['budget-use'] = el => {
  const id = el.dataset.id, v = +el.dataset.v, c = catIndex.get(id);
  commit(s => { const x = s.categories.find(y => y.id === id); if (x) x.budget = v; }, `${c.name} budget set to ${money(v)}.`);
};
CHANGE['cat-name'] = el => {
  const name = el.value.trim().slice(0, 60), id = el.dataset.id;
  if (!name) { render(); return; }
  if (name === catIndex.get(id)?.name) return;
  setTimeout(() => commit(s => { const x = s.categories.find(y => y.id === id); if (x) x.name = name; }), 0);
};
CHANGE['cat-icon'] = el => {
  const icon = el.value.trim().slice(0, 8) || '•', id = el.dataset.id;
  if (icon === catIndex.get(id)?.icon) return;
  setTimeout(() => commit(s => { const x = s.categories.find(y => y.id === id); if (x) x.icon = icon; }), 0);
};
SUBMIT['cat-add'] = form => {
  const name = form.elements.name.value.trim().slice(0, 60), kind = form.dataset.kind;
  if (!name) { form.elements.name.focus(); return; }
  if (state.categories.some(c => c.kind === kind && norm(c.name) === norm(name))) { toast(`There's already a category called ${name}.`); return; }
  const icon = form.elements.icon.value.trim().slice(0, 8) || { expense: '🏷️', income: '💶', transfer: '↔️' }[kind];
  const id = 'c_' + uid();
  commit(s => {
    const c = { id, name, icon, kind, budget: null };
    const lastSame = s.categories.map(x => x.kind).lastIndexOf(kind);
    s.categories.splice(lastSame + 1, 0, c);
  }, `Added ${name}.`);
};
ACT['cat-delete'] = el => {
  const id = el.dataset.id, c = catIndex.get(id);
  if (!c || id === 'uncat') return;
  const n = state.tx.filter(t => t.cat === id).length;
  const rn = state.recurring.filter(r => r.cat === id).length;
  const un = state.rules.filter(r => r.cat === id).length;
  const parts = [n && plural(n, 'entry', 'entries'), rn && plural(rn, 'recurring payment'), un && plural(un, 'auto-categorize rule')].filter(Boolean);
  const target = state.categories.find(x => x.kind === c.kind && x.id !== id && (x.id === 'other' || x.id === 'inc_other')) ? (c.kind === 'income' ? 'inc_other' : 'other') : 'uncat';
  const body = parts.length
    ? `<p>${parts.join(', ').replace(/, ([^,]*)$/, ' and $1')} ${n + rn + un === 1 ? 'uses' : 'use'} ${esc(c.name)}.</p>
       <label class="field" style="margin-top:12px">Move them to<select name="to">${catOptions(target === id ? 'uncat' : target, { kinds: ['expense', 'income', 'transfer', 'auto'] }).replace(`<option value="${esc(id)}"`, `<option disabled value="${esc(id)}"`)}</select></label>`
    : `<p>Nothing uses ${esc(c.name)} yet.</p>`;
  openModal({
    title: `Delete ${c.name}?`,
    body: `<form id="cat-del-form" data-form="cat-delete" data-id="${esc(id)}">${body}</form>`,
    foot: '<button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" form="cat-del-form" class="btn danger-fill">Delete category</button>',
  });
};
SUBMIT['cat-delete'] = form => {
  const id = form.dataset.id, c = catIndex.get(id);
  let to = form.elements.to ? form.elements.to.value : 'uncat';
  if (!catIndex.has(to) || to === id) to = 'uncat';
  form.closest('dialog')?.close('ok');
  commit(s => {
    for (const t of s.tx) if (t.cat === id) t.cat = to;
    for (const r of s.recurring) if (r.cat === id) r.cat = to;
    s.rules = to === 'uncat' ? s.rules.filter(r => r.cat !== id) : s.rules.map(r => (r.cat === id ? { ...r, cat: to } : r));
    s.categories = s.categories.filter(x => x.id !== id);
  }, `Deleted ${c.name}.`);
};

/* ---------- recurring payments ---------- */
function recFormBody(r) {
  const d = r || { type: 'expense', amount: null, cat: '', note: '', freq: 'monthly', start: today(), active: true };
  const kinds = d.type === 'income' ? ['income', 'transfer'] : ['expense', 'transfer'];
  return `<form id="rec-form" data-form="recurring" data-id="${esc(r ? r.id : '')}" autocomplete="off">
    <div class="field-grid">
      <label class="field full">Description<input type="text" name="note" value="${esc(d.note)}" maxlength="120" placeholder="Rent, Cosmote, Spotify…" autofocus></label>
      <label class="field">Money<select name="type" data-change="rec-type"><option value="expense"${d.type === 'expense' ? ' selected' : ''}>Out (a payment)</option><option value="income"${d.type === 'income' ? ' selected' : ''}>In (salary, allowance)</option></select></label>
      <label class="field">Amount<input type="text" name="amount" inputmode="decimal" value="${esc(amountToInput(d.amount))}" placeholder="${decimalSep() === ',' ? '0,00' : '0.00'}"></label>
      <label class="field">Category<select name="cat"><option value="">Choose…</option>${catOptions(d.cat, { kinds })}</select></label>
      <label class="field">Repeats<select name="freq" data-change="rec-preview"><option value="monthly"${d.freq === 'monthly' ? ' selected' : ''}>Every month</option><option value="yearly"${d.freq === 'yearly' ? ' selected' : ''}>Every year</option><option value="weekly"${d.freq === 'weekly' ? ' selected' : ''}>Every week</option></select></label>
      <label class="field full">${r ? 'Schedule starts on' : 'First payment on'}<input type="date" name="start" value="${esc(d.start)}" data-change="rec-preview" data-input="rec-preview"></label>
      ${r ? `<label class="check full"><input type="checkbox" name="active"${d.active ? ' checked' : ''}> Active (untick to pause)</label>` : ''}
    </div>
    <p class="note-box" id="rec-preview" style="margin-top:12px"></p>
    <p class="form-error" hidden></p>
  </form>`;
}
function openRecurringModal(r = null) {
  const dlg = openModal({
    title: r ? 'Edit recurring payment' : 'New recurring payment',
    body: recFormBody(r),
    foot: `${r ? '<button type="button" class="btn danger" data-act="rec-delete" data-id="' + esc(r.id) + '">Delete</button><span class="spacer"></span>' : ''}<button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" form="rec-form" class="btn primary">${r ? 'Save changes' : 'Add recurring payment'}</button>`,
  });
  updateRecPreview(dlg.querySelector('form'));
}
function updateRecPreview(form) {
  if (!form) return;
  const p = form.querySelector('#rec-preview');
  const start = form.elements.start.value, freq = form.elements.freq.value;
  if (!isYMD(start)) { p.textContent = 'Pick the date of the first payment.'; return; }
  const r = form.dataset.id ? state.recurring.find(x => x.id === form.dataset.id) : null;
  const n = pastDueCount(start, freq, r ? r.last : null);
  const next = nextDue({ start, freq, last: r ? r.last : null });
  if (r) p.textContent = n ? `${plural(n, 'missed payment')} will be added when you save. Next after that: ${fmtDayAuto(next)}.` : `Next payment: ${fmtDayAuto(next)}. Past entries it added stay as they are.`;
  else if (n === 0) p.textContent = `The first payment will be added on ${fmtDayAuto(start)}.`;
  else if (n === 1) p.textContent = `One payment (${fmtDayAuto(start)}) will be added right away. Next: ${fmtDayAuto(next)}.`;
  else p.textContent = `${plural(n, 'past payment')} will be added right away, from ${fmtDayAuto(start)}. Next: ${fmtDayAuto(next)}.`;
}
CHANGE['rec-preview'] = el => updateRecPreview(el.form);
INPUT['rec-preview'] = el => updateRecPreview(el.form);
CHANGE['rec-type'] = el => {
  const form = el.form, sel = form.elements.cat, prevVal = sel.value;
  const kinds = el.value === 'income' ? ['income', 'transfer'] : ['expense', 'transfer'];
  sel.innerHTML = `<option value="">Choose…</option>${catOptions(prevVal, { kinds })}`;
  if (![...sel.options].some(o => o.value === prevVal)) sel.value = '';
};
SUBMIT['recurring'] = form => {
  const err = msg => { const p = form.querySelector('.form-error'); p.textContent = msg; p.hidden = false; };
  const note = form.elements.note.value.trim();
  const v = parseAmount(form.elements.amount.value);
  const type = form.elements.type.value === 'income' ? 'income' : 'expense';
  const catId = form.elements.cat.value, freq = form.elements.freq.value, start = form.elements.start.value;
  if (!Number.isFinite(v) || v <= 0) { err('Enter an amount above zero.'); form.elements.amount.focus(); return; }
  if (!catIndex.has(catId)) { err('Choose a category.'); form.elements.cat.focus(); return; }
  if (!isYMD(start)) { err('Pick the date of the first payment.'); form.elements.start.focus(); return; }
  const amount = Math.round(v * 100), id = form.dataset.id;
  const active = form.elements.active ? form.elements.active.checked : true;
  form.closest('dialog')?.close('ok');
  if (id) {
    commit(s => {
      const r = s.recurring.find(x => x.id === id);
      if (r) Object.assign(r, { note, amount, type, cat: catId, freq, start, active });
      runRecurring(s);
    }, 'Recurring payment saved.');
  } else {
    const due = pastDueCount(start, freq, null);
    commit(s => {
      s.recurring.push({ id: uid(), type, amount, cat: catId, note, freq, start, last: null, active: true });
      runRecurring(s);
    }, due ? `Recurring payment added, and ${plural(due, 'payment')} already due ${due === 1 ? 'was' : 'were'} entered.` : 'Recurring payment added.');
  }
};
ACT['rec-new'] = () => openRecurringModal();
ACT['rec-edit'] = el => { const r = state.recurring.find(x => x.id === el.dataset.id); if (r) openRecurringModal(r); };
ACT['rec-delete'] = el => {
  const id = el.dataset.id;
  el.closest('dialog')?.close('ok');
  commit(s => { s.recurring = s.recurring.filter(r => r.id !== id); }, 'Recurring payment deleted. Entries it already added are kept.');
};

function headScore(cell, words) {
  if (typeof cell !== 'string') return 0;
  const n = norm(cell).replace(/[:.*]+$/, '').replace(/\s*\(.*\)$/, '');

    const buf = await file.arrayBuffer();
    const u8 = new Uint8Array(buf);
    const imp = { file: file.name, buf, enc: 'auto', kind: 'text', rows: [], delim: null };

    if (!imp.rows.some(r => r && r.filter(c => c !== '' && c != null).length >= 2)) throw new Error("Couldn't find any rows of data in that file.");
