  const { fresh, matched } = importPlan();
  const out = fresh.filter(t => t.type === 'expense'), inn = fresh.filter(t => t.type === 'income');
  const dups = res.items.filter(t => t.dup).length;
  const needCat = fresh.filter(t => t.cat === 'uncat').length;
  const skippedN = res.skipped.noDate + res.skipped.noAmount;
  const dateRange = fresh.length ? (() => { const ds = fresh.map(t => t.date).sort(); return `${fmtDayYear(ds[0])} to ${fmtDayYear(ds[ds.length - 1])}`; })() : '';
  const summary = fresh.length
    ? `<b>${plural(fresh.length, 'new entry', 'new entries')}</b>${dateRange ? `, ${dateRange}` : ''}: ${out.length} out (${money(sumBy(out, t => t.amount))}), ${inn.length} in (${money(sumBy(inn, t => t.amount))}).`
      + (needCat ? ` ${needCat} will need a category.` : ' All of them get a category from your rules.')
    : '<b>Nothing new to import.</b>';
  const foreign = Object.entries(res.skipped.foreign).map(([c, n]) => `${plural(n, 'row')} in ${esc(c)} (enter a rate above to include them)`);
  const extras = [dups && `${plural(dups, 'row')} already imported`,
    cfg.skipMatched && matched.length && `${plural(matched.length, 'row')} you already entered yourself`,
    skippedN && `${plural(skippedN, 'row')} without a readable date or amount`,
    res.skipped.reverted && `${plural(res.skipped.reverted, 'reverted or declined payment')}`,
    res.skipped.pending && `${plural(res.skipped.pending, 'pending payment')} (import again once completed)`,
    res.skipped.income && `${plural(res.skipped.income, 'money-in row')} left out`, ...foreign].filter(Boolean);

  const tag = t => (t.dup ? '<span class="tag">already imported</span>' : t.match && cfg.skipMatched ? '<span class="tag">you entered this</span>' : '');
  const preview = res.items.slice(0, 12).map(t => {
    const c = cat(t.cat), inc = t.type === 'income', off = t.dup || (t.match && cfg.skipMatched);
    return `<tr class="${off ? 'dup' : ''}"><td>${esc(fmtDayYear(t.date))}</td><td class="desc" title="${esc(t.note)}">${esc(t.note) || '<span class="muted">No description</span>'}${tag(t)}</td><td><span class="cell-name"><span class="ico" aria-hidden="true">${esc(c.icon)}</span>${esc(c.name)}</span></td><td class="num${inc ? ' t-good' : ''}">${money(inc ? t.amount : -t.amount, { sign: inc })}</td></tr>`;
  }).join('');

  let matchBlock = '';
  if (matched.length) {
    const byId = new Map(state.tx.map(t => [t.id, t]));
    const rowsHtml = matched.slice(0, 20).map(t => {
      const m = byId.get(t.match), inc = t.type === 'income';
      return `<tr><td>${esc(fmtDM(t.date))}</td><td class="desc" title="${esc(t.note)}">${esc(t.note)}</td><td class="num">${money(inc ? t.amount : -t.amount, { sign: inc })}</td><td>${m ? `${esc(m.note || cat(m.cat).name)}, ${esc(fmtDM(m.date))}${m.rid ? ' (recurring)' : ''}` : ''}</td></tr>`;
    }).join('');
    matchBlock = `<div class="imp-match">
      <label class="check"><input type="checkbox" name="skipMatched" data-change="imp"${cfg.skipMatched ? ' checked' : ''}> Leave out ${plural(matched.length, 'row')} that ${matched.length === 1 ? 'matches an entry' : 'match entries'} you typed or a recurring payment, so nothing is counted twice</label>
      <details class="fold"><summary>See what matched</summary><div class="tbl-wrap"><table class="tbl imp-preview"><thead><tr><th>Bank date</th><th>Bank description</th><th class="num">Amount</th><th>Your entry</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>${matched.length > 20 ? `<p class="hint">Showing 20 of ${matched.length}.</p>` : ''}</details>
    </div>`;
  }

  // Column settings stay folded away when the file was read without trouble.
  const showCols = imp.showCols ?? res.items.length === 0;
  return `<div class="imp">
    <p class="imp-file"><b>${esc(imp.file)}</b>: ${plural(dataRows, 'row')}${imp.kind === 'text' ? `, separated by ${delimName}` : imp.kind === 'xlsx' ? ' in the first sheet' : ''}.</p>
    <div class="imp-grid imp-top">
      ${acctField}
      ${rateFields}
    </div>
    <div class="imp-summary">${summary}${extras.length ? `<br><span class="muted">Left out: ${extras.join(', ')}.</span>` : ''}</div>
    ${matchBlock}
    ${preview ? `<div class="tbl-wrap"><table class="tbl imp-preview"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th></tr></thead><tbody>${preview}</tbody></table></div>${res.items.length > 12 ? `<p class="hint" style="margin-top:6px">Showing the first 12 of ${plural(res.items.length, 'row')}.</p>` : ''}` : '<p class="muted">No rows could be read with these settings. Try another header row or different columns below.</p>'}
    <details class="fold imp-cols"${showCols ? ' open' : ''} data-toggle="imp-cols"><summary>Dates or amounts look wrong? Change how the file is read</summary>
    <div class="imp-grid" style="margin-top:10px">
      <label>Header row${sel('headerRow', opt(-1, 'No header row', cfg.headerRow) + rows.slice(0, 30).map((r, i) => opt(i, `Row ${i + 1}: ${esc((r || []).filter(c => c !== '').slice(0, 3).join(', ').slice(0, 40))}`, cfg.headerRow)).join(''))}</label>
      <label>Date column${sel('dateCol', colOpts(cfg.dateCol))}</label>
      <label>Date format${sel('dateFmt', opt('dmy', 'Day/month/year (31/12/2026)', cfg.dateFmt) + opt('mdy', 'Month/day/year (12/31/2026)', cfg.dateFmt) + opt('ymd', 'Year-month-day (2026-12-31)', cfg.dateFmt) + opt('excel', 'Excel date number', cfg.dateFmt) + opt('text', 'Written out (31 Dec 2026)', cfg.dateFmt))}</label>
      <label>Description column${sel('descCol', colOpts(cfg.descCol, 'None'))}</label>
      <label>Shop or person column, added to the description${sel('desc2Col', colOpts(cfg.desc2Col, 'None'))}</label>
      <label>Card purchase date column, used when filled in${sel('date2Col', colOpts(cfg.date2Col, 'None'))}</label>
      <label>Amounts are in${sel('mode', opt('signed', 'One column with + and −', cfg.mode) + opt('split', 'Separate out and in columns', cfg.mode) + opt('dc', 'One column plus a Χ/Π or D/C marker', cfg.mode))}</label>
      ${amountFields}
      <label>Decimal mark${sel('dec', opt(',', 'Comma (12,50)', cfg.dec) + opt('.', 'Point (12.50)', cfg.dec))}</label>
      ${imp.kind === 'text' ? `<label>Text encoding${sel('enc', opt('auto', `Automatic${imp.encUsed ? ` (${imp.encUsed === 'windows-1253' ? 'Greek Windows-1253' : imp.encUsed.toUpperCase()})` : ''}`, imp.enc) + opt('utf-8', 'UTF-8', imp.enc) + opt('windows-1253', 'Greek (Windows-1253)', imp.enc) + opt('iso-8859-7', 'Greek (ISO-8859-7)', imp.enc) + opt('windows-1252', 'Western (Windows-1252)', imp.enc))}</label>` : ''}
      <label class="check"><input type="checkbox" name="includeIncome" data-change="imp"${cfg.includeIncome ? ' checked' : ''}> Include money in (salary, refunds)</label>
    </div></details>
  </div>`;
}
/* Remember whether the column settings are open while the dialog redraws. */
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.dataset && d.dataset.toggle === 'imp-cols' && ui.imp) ui.imp.showCols = d.open;
}, true);

CHANGE['imp'] = el => {
  const imp = ui.imp;
  if (!imp || imp.busy) return;
  imp.busy = true;
  try { importChanged(el, imp); } finally { imp.busy = false; }
};
function importChanged(el, imp) {
  const cfg = imp.cfg, name = el.name;
  const keep = () => ({ includeIncome: cfg.includeIncome, skipMatched: cfg.skipMatched, acct: cfg.acct, acctName: cfg.acctName });
  if (name === 'enc') {
    imp.enc = el.value;
    const k = keep();
    decodeImportText(imp);
    imp.cfg = Object.assign(importConfig(imp.rows, detectHeaderRow(imp.rows)), k);
  } else if (name === 'headerRow') {
    imp.cfg = Object.assign(importConfig(imp.rows, +el.value), keep());
  } else if (name === 'mode') {
    cfg.mode = el.value;
    const data = imp.rows.slice(cfg.headerRow + 1);
    if (cfg.mode === 'signed' || cfg.mode === 'dc') {
      if (cfg.amountCol < 0) cfg.amountCol = cfg.debitCol >= 0 ? cfg.debitCol : cfg.creditCol;
      if (cfg.mode === 'signed' && cfg.amountCol >= 0) cfg.sign = data.some(r => r && parseAmount(r[cfg.amountCol], cfg.dec) < 0) ? 'negout' : 'posout';
    }
  } else if (name === 'includeIncome' || name === 'skipMatched') cfg[name] = el.checked;
  else if (name === 'acct') { cfg.acct = el.value; if (cfg.acct === '__new' && !cfg.acctName) cfg.acctName = state.accounts.length ? `Account ${state.accounts.length + 1}` : 'My bank'; }
  else if (name === 'acctName') cfg.acctName = el.value.slice(0, 40);
  else if (name.startsWith('rate:')) cfg.rates[name.slice(5)] = el.value.trim();
  else if (['dateFmt', 'dec', 'sign'].includes(name)) cfg[name] = el.value;
  else {
    cfg[name] = +el.value;
    if (name === 'dateCol' && cfg.dateCol >= 0) cfg.dateFmt = detectDateFormat(imp.rows.slice(cfg.headerRow + 1).map(r => r && r[cfg.dateCol]));
    if (name === 'date2Col' && cfg.date2Col >= 0) cfg.date2Fmt = detectDateFormat(imp.rows.slice(cfg.headerRow + 1).map(r => r && r[cfg.date2Col]));
  }
  refreshImportModal();
  const again = $(`dialog.modal[open] [name="${CSS.escape(name)}"]`);
  if (again) again.focus();
}

ACT['imp-commit'] = el => {
  const imp = ui.imp;
  if (!imp || !imp.res) return;
  const cfg = imp.cfg;
  const { fresh, confirm } = importPlan();
  if (!fresh.length && !confirm.length) return;
  const batchId = uid(), file = imp.file, stamp = Date.now(), sig = importSig(imp.rows, cfg);
  const needCat = fresh.filter(t => t.cat === 'uncat').length;
  const newName = cfg.acct === '__new' ? cfg.acctName.trim().slice(0, 40) : '';
  el.closest('dialog')?.close('ok');
  if (fresh.length) Object.assign(ui.f, { batch: batchId, scope: 'all', needs: false, q: '', cat: '', type: '', acct: '', show: 200 });
  const parts = [];
  if (fresh.length) parts.push(`Imported ${plural(fresh.length, 'entry', 'entries')}`);
  if (confirm.length) parts.push(`${fresh.length ? 'left out ' : 'Left out '}${plural(confirm.length, 'row')} you had already entered`);
  commit(s => {
    let acctId = '';
    if (newName) {
      const same = s.accounts.find(a => norm(a.name) === norm(newName));
      if (same) acctId = same.id; else { acctId = 'a_' + uid(); s.accounts.push({ id: acctId, name: newName, sigs: [] }); }
    } else if (cfg.acct && cfg.acct !== '__new' && s.accounts.some(a => a.id === cfg.acct)) acctId = cfg.acct;
    const acct = s.accounts.find(a => a.id === acctId);
    if (acct && sig && !(acct.sigs || []).includes(sig)) acct.sigs = [...(acct.sigs || []), sig].slice(-12);
    if (fresh.length) {
      const b = { id: batchId, file, at: new Date().toISOString(), count: fresh.length };
      if (acctId) b.acct = acctId;
      s.imports.unshift(b);
    }
    fresh.forEach((t, i) => {
      const e = { id: uid(), date: t.date, amount: t.amount, type: t.type, cat: t.cat, note: t.note, src: 'import', batch: batchId, bk: t.key, created: stamp + i };
      if (acctId) e.acct = acctId;
      s.tx.push(e);
    });
    // Entries you typed that the statement confirms: remember the bank row so it is never imported later.
    const byId = new Map(s.tx.map(t => [t.id, t]));
    for (const t of confirm) { const m = byId.get(t.match); if (m) { m.bk = t.key; if (acctId && !m.acct) m.acct = acctId; } }
  }, `${parts.join(', ')}${needCat ? `. ${needCat} need a category` : ''}.`);
  if (fresh.length) { if (location.hash !== '#entries') location.hash = '#entries'; else render(); }
  offerReview();
};

/* =========================================================================
   Charts, drawn as inline SVG. Colors come from CSS, so themes just work.
   ========================================================================= */
const fmtDayLong = s => DF.dayLong.format(toDate(s));
const linePath = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
function colPath(x0, yTop, w, h, r) {
  if (h <= 0.5) return '';
  r = Math.min(r, h, w / 2);
  const x1 = x0 + w, yb = yTop + h;
  return `M${x0.toFixed(1)} ${yb.toFixed(1)}V${(yTop + r).toFixed(1)}Q${x0.toFixed(1)} ${yTop.toFixed(1)} ${(x0 + r).toFixed(1)} ${yTop.toFixed(1)}H${(x1 - r).toFixed(1)}Q${x1.toFixed(1)} ${yTop.toFixed(1)} ${x1.toFixed(1)} ${(yTop + r).toFixed(1)}V${yb.toFixed(1)}Z`;
}
function textWidth(s, px = 11.5) { return s.length * px * 0.56; }

/* Cumulative spending through the month against the planned pace. */
function drawPaceChart(st) {
  const host = $('#pace-chart');
  if (!host) return;
  const W = Math.max(280, Math.floor(host.clientWidth || 600));
  const narrow = W < 520;
  const H = narrow ? 210 : 250;
  const m = { t: 24, r: narrow ? 8 : 14, b: 26, l: narrow ? 46 : 56 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const D = st.days;
  const last = st.status === 'current' ? st.dayNum : st.status === 'past' ? D : 0;
  const act = st.cum.slice(0, last + 1);
  const vals = [...act, st.limit || 0];
  if (st.ideal) vals.push(...st.ideal);
  if (st.projPath) vals.push(...st.projPath.filter(v => v != null));
  const sc = niceScale(Math.min(0, ...act), Math.max(1000, ...vals), narrow ? 3 : 4);
  const x = d => m.l + (d / D) * iw;
  const y = v => m.t + ih - ((v - sc.lo) / (sc.hi - sc.lo)) * ih;

  const aria = `Month pace for ${fmtMonth(st.mk)}. ${last ? `${money(act[last])} spent by day ${last}` : 'Nothing spent yet'}${st.ideal && last ? `, planned ${money(st.ideal[last])}` : ''}${st.projPath ? `, projected ${money(st.projected)} by the end of the month` : ''}${st.limit ? `. Limit ${money(st.limit)}` : ''}. Use the left and right arrow keys to read each day.`;
  const p = [`<svg class="svg-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${esc(aria)}">`];
  for (const v of sc.ticks) {
    const yy = Math.round(y(v)) + 0.5;
    p.push(`<line class="${v === 0 ? 'base' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/>`);
    p.push(`<text class="axis" x="${m.l - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle">${esc(moneyAxis(v))}</text>`);
  }
  const xt = (narrow ? [1, 10, 20, D] : [1, 5, 10, 15, 20, 25, D]).filter((d, i, a) => d <= D && (d === D || D - d >= 3) && a.indexOf(d) === i);
  for (const d of xt) {
    p.push(`<text class="axis" x="${x(d).toFixed(1)}" y="${H - 7}" text-anchor="${d === D ? 'end' : 'middle'}">${d === 1 ? esc(fmtMon(st.mk)) + ' 1' : d}</text>`);
  }
  let limitLabel = null;
  if (st.limit) {
    const yy = Math.round(y(st.limit)) + 0.5;
    const txt = `Limit ${money(st.limit, { whole: st.limit % 100 === 0 })}`;
    const tw = textWidth(txt, 12);
    let lx = W - m.r, anchor = 'end';
    const todayX = st.status === 'current' ? x(last) : -999;
    if (Math.abs(todayX - (lx - tw / 2)) < tw / 2 + 24 && yy - 6 < m.t + 12) { lx = m.l + 6; anchor = 'start'; }
    p.push(`<line class="limit" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/>`);
    p.push(`<text class="lbl" x="${lx}" y="${yy - 6}" text-anchor="${anchor}">${esc(txt)}</text>`);
    limitLabel = { x0: anchor === 'end' ? lx - tw : lx, x1: anchor === 'end' ? lx : lx + tw, y: yy - 6 };
  }
  if (st.ideal) p.push(`<path class="pace" d="${linePath(st.ideal.map((v, d) => [x(d), y(v)]))}"/>`);
  if (st.status === 'current') {
    const xx = Math.round(x(last)) + 0.5;
    p.push(`<line class="today" x1="${xx}" x2="${xx}" y1="${m.t - 6}" y2="${m.t + ih}"/>`);
    p.push(`<text class="axis" x="${xx}" y="${m.t - 11}" text-anchor="middle">Today</text>`);
  }
  if (last > 0) {
    const pts = act.map((v, d) => [x(d), y(v)]);
    p.push(`<path class="area" d="${linePath(pts)}L${x(last).toFixed(1)} ${y(0).toFixed(1)}L${x(0).toFixed(1)} ${y(0).toFixed(1)}Z"/>`);
    p.push(`<path class="actual" d="${linePath(pts)}"/>`);
  }
  if (st.projPath) {
    const pts = [];
    for (let d = last; d <= D; d++) if (st.projPath[d] != null) pts.push([x(d), y(st.projPath[d])]);
    if (pts.length > 1) p.push(`<path class="proj" d="${linePath(pts)}"/>`);
  }
  if (last > 0) {
    const ex = x(last), ey = y(act[last]);
    p.push(`<circle class="dot" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4.5"/>`);
    const txt = money(act[last], { whole: true });
    const tw = textWidth(txt, 12);
    const right = ex + 8 + tw < W - m.r;
    let lx = right ? ex + 8 : ex - 8, ly = ey - 8;
    if (ly < m.t + 4) ly = ey + 16;
    const x0 = right ? lx : lx - tw, x1 = right ? lx + tw : lx;
    const hitsLimit = limitLabel && Math.abs(limitLabel.y - ly) < 13 && x0 < limitLabel.x1 && x1 > limitLabel.x0;
    if (!hitsLimit) p.push(`<text class="lbl-strong" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${right ? 'start' : 'end'}">${esc(txt)}</text>`);
  }
  p.push(`<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/><circle class="hdot" r="4.5" visibility="hidden"/>`);
  p.push(`<rect x="${m.l}" y="${m.t - 6}" width="${iw}" height="${ih + 6}" fill="transparent"/>`);
  p.push('</svg>');
  host.innerHTML = p.join('');

  const svg = host.firstElementChild, xh = svg.querySelector('.xhair'), hd = svg.querySelector('.hdot');
  let cur = null;
  const hide = () => { xh.setAttribute('visibility', 'hidden'); hd.setAttribute('visibility', 'hidden'); hideTip(); };
  const show = (d, clientX, clientY) => {
    cur = d;
    const xx = x(d);
    xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.setAttribute('visibility', 'visible');
    let yv = null;
    if (d <= last) yv = act[d];
    else if (st.projPath && st.projPath[d] != null) yv = st.projPath[d];
    else if (st.ideal) yv = st.ideal[d];
    if (yv != null) { hd.setAttribute('cx', xx); hd.setAttribute('cy', y(yv)); hd.setAttribute('visibility', 'visible'); }
    else hd.setAttribute('visibility', 'hidden');
    const rows = [];
    if (d <= last) {
      rows.push({ key: 'line', value: money(act[d]), label: 'spent so far' });
      rows.push({ key: 'none', value: money(st.daily[d]), label: 'spent that day' });
    }
    if (st.ideal) rows.push({ key: 'pace', value: money(st.ideal[d]), label: 'planned' });
    if (st.projPath && st.projPath[d] != null && d > last) rows.push({ key: 'dash', value: money(st.projPath[d]), label: 'projected' });
    if (!rows.length) rows.push({ key: 'none', value: '–', label: 'no data yet' });
    const r = svg.getBoundingClientRect();
    showTip(clientX ?? r.left + xx, clientY ?? r.top + (yv != null ? y(yv) : m.t), fmtDayLong(`${st.mk}-${pad2(d)}`), rows);
  };
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    show(clamp(Math.round((e.clientX - r.left - m.l) / iw * D), 1, D), e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => show(cur || Math.max(1, last)));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(clamp((cur || Math.max(1, last)) + (e.key === 'ArrowRight' ? 1 : -1), 1, D)); }
    else if (e.key === 'Escape') hide();
  });
}

/* Monthly spending columns with income as a line, one shared axis. */
function drawTrendChart(ms) {
  const host = $('#trend-chart');
  if (!host) return;
  const W = Math.max(280, Math.floor(host.clientWidth || 600));
  const narrow = W < 560;
  const H = narrow ? 220 : 260;
  const m = { t: 20, r: 8, b: 28, l: narrow ? 46 : 56 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = ms.length, band = iw / n, bw = Math.min(24, band * 0.46);
  const lim = effectiveLimit();
  const L = lim ? lim.value : null;
  const vmax = Math.max(1000, L || 0, ...ms.map(b => Math.max(b.spent, b.projected || 0, b.income)));
  const sc = niceScale(0, vmax, narrow ? 3 : 4);
  const y = v => m.t + ih - ((v - sc.lo) / (sc.hi - sc.lo)) * ih;
  const cx = i => m.l + band * (i + 0.5);
  const firstData = ms.findIndex(b => b.n > 0);

  const p = [`<svg class="svg-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Spending and income by month. Tab through the months to read each one.">`];
  for (const v of sc.ticks) {
    const yy = Math.round(y(v)) + 0.5;
    p.push(`<line class="${v === 0 ? 'base' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/>`);
    p.push(`<text class="axis" x="${m.l - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle">${esc(moneyAxis(v))}</text>`);
  }
  ms.forEach((b, i) => {
    const showLabel = !narrow || i % 2 === (n - 1) % 2;
    if (!showLabel) return;
    const yr = b.mk.slice(5) === '01' || i === 0 ? ` \u2019${b.mk.slice(2, 4)}` : '';
    p.push(`<text class="axis" x="${cx(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(fmtMon(b.mk) + yr)}</text>`);
  });
  ms.forEach((b, i) => {
    const x0 = cx(i) - bw / 2, s = Math.max(0, b.spent);
    const label = `${fmtMonth(b.mk)}: spent ${money(b.spent)}${b.projected != null && b.status === 'current' ? `, projected ${money(b.projected)}` : ''}, income ${money(b.income)}`;
    let bars = '';
    const proj = b.status === 'current' && b.projected != null && b.projected > s ? b.projected : null;
    if (proj != null) {
      if (s > 0) bars += `<rect class="bar-a" x="${x0.toFixed(1)}" y="${y(s).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0) - y(s)).toFixed(1)}"/>`;
      const top = y(proj), bottom = s > 0 ? y(s) - 2 : y(0);
      bars += `<path class="bar-p" d="${colPath(x0, top, bw, bottom - top, 4)}"/>`;
    } else if (s > 0) {
      bars += `<path class="bar-a" d="${colPath(x0, y(s), bw, y(0) - y(s), 4)}"/>`;
    }
    p.push(`<g class="band" tabindex="0" data-i="${i}" aria-label="${esc(label)}"><rect class="band-hit" x="${(m.l + band * i + 1).toFixed(1)}" y="${m.t}" width="${(band - 2).toFixed(1)}" height="${ih}" rx="4"/>${bars}</g>`);
  });
  if (L) {
    const yy = Math.round(y(L)) + 0.5;
    p.push(`<line class="limit" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" pointer-events="none"/>`);
    p.push(`<text class="lbl" x="${m.l + 6}" y="${yy - 6}" text-anchor="start" pointer-events="none">Limit ${esc(money(L, { whole: L % 100 === 0 }))}</text>`);
  }
  if (firstData >= 0) {
    const pts = [];
    let curPt = null;
    for (let i = firstData; i < n; i++) {
      const b = ms[i];
      if (b.status === 'past') pts.push([cx(i), y(Math.max(0, b.income))]);
      else if (b.status === 'current') { const v = Math.max(b.income, b.expIncome || 0); if (v > 0) curPt = [cx(i), y(v)]; }
    }
    if (pts.length > 1) p.push(`<path class="inc" d="${linePath(pts)}" pointer-events="none"/>`);
    if (curPt && pts.length) p.push(`<path class="inc inc-exp" d="${linePath([pts[pts.length - 1], curPt])}" pointer-events="none"/>`);
    for (const [px, py] of pts) p.push(`<circle class="inc-dot" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" pointer-events="none"/>`);
    if (curPt) p.push(`<circle class="inc-dot hollow" cx="${curPt[0].toFixed(1)}" cy="${curPt[1].toFixed(1)}" r="4" pointer-events="none"/>`);
  }
  p.push('</svg>');
  host.innerHTML = p.join('');

  const svg = host.firstElementChild;
  const tipFor = (g, clientX, clientY) => {
    const b = ms[+g.dataset.i];
    const rows = [{ key: 'bar', value: money(b.spent), label: 'spent' }];
    if (b.status === 'current' && b.projected != null) rows.push({ key: 'proj', value: money(b.projected), label: 'projected' });
    rows.push({ key: 'inc', value: money(b.income), label: b.status === 'current' ? 'income so far' : 'income' });
    if (b.status === 'current' && b.expIncome > b.income) rows.push({ key: 'none', value: money(b.expIncome), label: 'income expected' });
    rows.push({ key: 'none', value: money(b.income - b.spent, { sign: true }), label: 'net' });
    const r = g.getBoundingClientRect();
    showTip(clientX ?? r.left + r.width / 2, clientY ?? r.top + 20, fmtMonth(b.mk), rows);
  };
  for (const g of svg.querySelectorAll('.band')) {
    g.addEventListener('pointermove', e => tipFor(g, e.clientX, e.clientY));
    g.addEventListener('pointerleave', hideTip);
    g.addEventListener('focus', () => tipFor(g));
    g.addEventListener('blur', hideTip);
  }
}

window.addEventListener('resize', debounce(() => {
  if (ui.tab === 'overview' && ui._st) drawPaceChart(ui._st);
  if (ui.tab === 'trends' && ui._months) drawTrendChart(ui._months);

/* =========================================================================
   Merging two copies of the data (phone and computer), and going back to an
   earlier day.

   Rules: records are matched by id. When both sides have one, the side that
   changed it last wins. A deletion beats an older edit; a newer edit beats a
   deletion. Entries that exist on one side only are added, unless the other
   side already has an identical entry (same date, direction, amount and
   description), which happens when both devices imported the same statement.
   ========================================================================= */
function mergeStates(localState, incomingState) {
  const A = JSON.parse(JSON.stringify(localState)), B = JSON.parse(JSON.stringify(incomingState));
  const stats = { added: 0, updated: 0, removed: 0, same: 0 };
  const delA = A.deleted, delB = B.deleted;
  const gone = (bucket, key, x) => bucket[key] !== undefined && bucket[key] >= stampOf(x);
  // When the same thing was set up separately on both devices, both settle on the smaller id,
  // so later edits and deletions line up.
  const moveKey = (obj, from, to) => { if (obj[from] !== undefined) { obj[to] = Math.max(obj[to] || 0, obj[from]); delete obj[from]; } };
  const renameAcct = (from, to) => {
    for (const t of A.tx) if (t.acct === from) t.acct = to;
    for (const b of A.imports) if (b.acct === from) b.acct = to;
    moveKey(delA.acct, from, to);
  };
  const renameCat = (from, to) => {
    for (const t of A.tx) if (t.cat === from) t.cat = to;
    for (const r of A.recurring) if (r.cat === from) r.cat = to;
    for (const r of A.rules) if (r.cat === from) r.cat = to;
    moveKey(delA.cat, from, to);
  };
  const renameRec = (from, to) => {
    const pre = `r_${from}_`;
    for (const t of A.tx) if (t.rid === from) { t.rid = to; if (t.id.startsWith(pre)) t.id = `r_${to}_` + t.id.slice(pre.length); }
    for (const k of Object.keys(delA.tx)) if (k.startsWith(pre)) moveKey(delA.tx, k, `r_${to}_` + k.slice(pre.length));
    moveKey(delA.rec, from, to);
  };

  /* accounts: same id, or same name */
  const acctMap = new Map();
  for (const b of B.accounts) {
    const a = A.accounts.find(x => x.id === b.id) || A.accounts.find(x => norm(x.name) === norm(b.name));
    if (a) {
      if (b.id < a.id) { renameAcct(a.id, b.id); a.id = b.id; }
      acctMap.set(b.id, a.id);
      if (stampOf(b) > stampOf(a)) { a.name = b.name; a.upd = b.upd; }
      a.sigs = [...new Set([...(a.sigs || []), ...(b.sigs || [])])].slice(-12);
    } else if (!gone(delA.acct, b.id, b)) { A.accounts.push(b); acctMap.set(b.id, b.id); }
  }
  for (const [id, ts] of Object.entries(delB.acct)) {
    const i = A.accounts.findIndex(x => x.id === id);
    if (i >= 0 && stampOf(A.accounts[i]) <= ts) A.accounts.splice(i, 1);
  }

  /* categories: same id, or same kind and name */
  const catMap = new Map();
  for (const b of B.categories) {
    const a = A.categories.find(x => x.id === b.id) || A.categories.find(x => x.kind === b.kind && norm(x.name) === norm(b.name));
    if (a) {
      if (b.id < a.id && a.id.startsWith('c_') && b.id.startsWith('c_')) { renameCat(a.id, b.id); a.id = b.id; }
      catMap.set(b.id, a.id);
      if (a.id !== 'uncat' && stampOf(b) > stampOf(a)) Object.assign(a, { name: b.name, icon: b.icon, budget: b.budget, upd: b.upd }, a.id === b.id ? { kind: b.kind } : {});
    } else if (gone(delA.cat, b.id, b)) {
      catMap.set(b.id, 'uncat');
    } else {
      const lastSame = A.categories.map(x => x.kind).lastIndexOf(b.kind);
      A.categories.splice(lastSame + 1, 0, b);
      catMap.set(b.id, b.id);
    }
  }
  for (const [id, ts] of Object.entries(delB.cat)) {
    const i = A.categories.findIndex(x => x.id === id);
    if (i >= 0 && id !== 'uncat' && stampOf(A.categories[i]) <= ts) A.categories.splice(i, 1);
  }
  const mapCat = id => catMap.get(id) || 'uncat';

  /* recurring payments: same id, or the same payment set up separately on both devices */
  const schedule = r => (r.freq === 'weekly' ? toDate(r.start).getDay() : r.freq === 'yearly' ? r.start.slice(5) : r.start.slice(8));
  const recKey = r => `${r.type}|${r.amount}|${r.freq}|${norm(r.note)}|${schedule(r)}`;
  const ridMap = new Map();
  for (const b of B.recurring) {
    b.cat = mapCat(b.cat);
    const a = A.recurring.find(x => x.id === b.id) || A.recurring.find(x => recKey(x) === recKey(b));
    if (a) {
      if (b.id < a.id) { renameRec(a.id, b.id); a.id = b.id; }
      ridMap.set(b.id, a.id);
      const last = [a.last, b.last].filter(Boolean).sort().pop() || null;
      if (stampOf(b) > stampOf(a)) Object.assign(a, { type: b.type, amount: b.amount, cat: b.cat, note: b.note, freq: b.freq, start: b.start, active: b.active, upd: b.upd });
      a.last = last;
    } else if (!gone(delA.rec, b.id, b)) { A.recurring.push(b); ridMap.set(b.id, b.id); }
  }
  for (const [id, ts] of Object.entries(delB.rec)) {
    const i = A.recurring.findIndex(x => x.id === id);
    if (i >= 0 && stampOf(A.recurring[i]) <= ts) A.recurring.splice(i, 1);
  }

  // Deletions of recurring payments made on the other device, under the ids used here.
  for (const k of Object.keys(delB.tx)) {
    if (!k.startsWith('r_') || k.length < 14) continue;
    const rid = k.slice(2, -11), to = ridMap.get(rid);
    if (to && to !== rid) moveKey(delB.tx, k, `r_${to}_` + k.slice(-10));
  }

  /* entries */
  const byId = new Map(A.tx.map(t => [t.id, t]));
  const matched = new Set(), pending = [];
  for (const b of B.tx) {
    b.cat = mapCat(b.cat);
    if (b.acct) { const m = acctMap.get(b.acct); if (m) b.acct = m; else delete b.acct; }
    if (b.rid && ridMap.has(b.rid) && ridMap.get(b.rid) !== b.rid) {
      const to = ridMap.get(b.rid), pre = `r_${b.rid}_`;
      if (b.id.startsWith(pre)) b.id = `r_${to}_` + b.id.slice(pre.length);
      b.rid = to;
    }
    const a = byId.get(b.id);
    if (a) {
      matched.add(a.id);
      if (stampOf(b) > stampOf(a)) {
        const changed = txSig(a) !== txSig(b);
        Object.assign(a, { date: b.date, amount: b.amount, type: b.type, cat: b.cat, note: b.note, upd: b.upd });
        if (b.acct) a.acct = b.acct; else delete a.acct;
        if (b.bk) a.bk = b.bk; else delete a.bk;
        if (changed) stats.updated++; else stats.same++;
      } else stats.same++;
    } else if (gone(delA.tx, b.id, b)) stats.same++;
    else pending.push(b);
  }
  // Entries only one side has: identical ones are the same entry (both devices imported the statement).
  const pool = new Map();
  for (const a of A.tx) {
    if (matched.has(a.id)) continue;
    const k = dupKey(a);
    if (!pool.has(k)) pool.set(k, []);
    pool.get(k).push(a);
  }
  for (const b of pending) {
    const list = pool.get(dupKey(b));
    if (list && list.length) {
      const a = list.shift();
      if (b.bk && !a.bk) a.bk = b.bk;
      if (b.id < a.id && !byId.has(b.id)) { byId.delete(a.id); a.id = b.id; byId.set(a.id, a); }   // both devices settle on one id
      stats.same++;
    } else { A.tx.push(b); byId.set(b.id, b); stats.added++; }
  }
  // Deleted on the other device since we last changed them.
  const drop = new Set();
  for (const [id, ts] of Object.entries(delB.tx)) { const a = byId.get(id); if (a && stampOf(a) <= ts) drop.add(id); }
  if (drop.size) { A.tx = A.tx.filter(t => !drop.has(t.id)); stats.removed += drop.size; }

  /* rules: one per piece of text; new ones from the other device go on top */
  const aRules = new Map(A.rules.map(r => [ruleKey(r), r]));
  const fresh = [];
  for (const b of B.rules) {
    const c = catMap.get(b.cat);
    if (!c || c === 'uncat') continue;
    b.cat = c;
    const k = ruleKey(b), a = aRules.get(k);
    if (a) { if (stampOf(b) > stampOf(a)) { a.cat = b.cat; a.upd = b.upd; } }
    else if (!gone(delA.rule, k, b)) { fresh.push(b); aRules.set(k, b); }
  }
  A.rules = [...fresh, ...A.rules];
  for (const [k, ts] of Object.entries(delB.rule)) {
    const a = aRules.get(k);
    if (a && stampOf(a) <= ts) A.rules = A.rules.filter(r => r !== a);
  }

  /* the rest */
  const impIds = new Set(A.imports.map(x => x.id));
  for (const b of B.imports) {
    if (impIds.has(b.id)) continue;
    if (b.acct) { const m = acctMap.get(b.acct); if (m) b.acct = m; else delete b.acct; }
    A.imports.push(b);
  }
  A.imports.sort((x, y) => String(y.at).localeCompare(String(x.at)));
  A.dismissed = [...new Set([...(A.dismissed || []), ...(B.dismissed || [])])].slice(-3000);
  const bLimit = B.settings.limitUpd || 0, aLimit = A.settings.limitUpd || 0;
  if (bLimit > aLimit || (bLimit === aLimit && A.settings.limit == null && B.settings.limit != null)) {
    A.settings.limit = B.settings.limit; A.settings.limitUpd = bLimit;
  }
  A.settings.clock = Math.max(A.settings.clock || 0, B.settings.clock || 0);
  for (const kind of DELETED_KINDS) {
    for (const [k, ts] of Object.entries(delB[kind])) if (!(delA[kind][k] >= ts)) delA[kind][k] = ts;
  }
  // A record that exists again is no longer "deleted".
  const present = { tx: new Set(A.tx.map(t => t.id)), cat: new Set(A.categories.map(c => c.id)), rec: new Set(A.recurring.map(r => r.id)), rule: new Set(A.rules.map(ruleKey)), acct: new Set(A.accounts.map(a => a.id)) };
  for (const kind of DELETED_KINDS) for (const k of Object.keys(delA[kind])) if (present[kind].has(k)) delete delA[kind][k];

  return { state: normalizeState(A), stats };
}

/* ---------- bringing in a backup ---------- */
async function restoreFromText(text) {
  let next, exported = null;
  try {
    const raw = JSON.parse(text);
    next = normalizeState(raw);
    exported = typeof raw.exported === 'string' ? raw.exported : null;
  } catch (err) { toast(err instanceof SyntaxError ? "That isn't a Spend Control backup." : err.message); return; }
  const hasLocal = state.tx.length > 0 || state.recurring.length > 0;
  if (!hasLocal) { applyRestore(next, exported, 'Backup restored.'); return; }

  const m = mergeStates(state, next), st = m.stats;
  const bits = [];
  if (st.added) bits.push(`add ${plural(st.added, 'entry', 'entries')}`);
  if (st.updated) bits.push(`update ${st.updated}`);
  if (st.removed) bits.push(`remove ${st.removed} that ${st.removed === 1 ? 'was' : 'were'} deleted on the other device`);
  const when = exported ? `, saved ${fmtDayAuto(exported.slice(0, 10))}` : '';
  const mergeLine = bits.length
    ? `<b>Merge</b> keeps what's here and brings in what's new from the backup. It would ${bits.join(', ').replace(/, ([^,]*)$/, ' and $1')}.`
    : "<b>Merge</b> keeps what's here and brings in what's new from the backup. The entries already match, so only settings such as budgets and rules could change.";
  ui.pendingRestore = { next, exported, merged: m.state, stats: st };
  openModal({
    title: 'Bring in this backup',
    body: `<p>The backup has ${plural(next.tx.length, 'entry', 'entries')}${when}. This device has ${plural(state.tx.length, 'entry', 'entries')}.</p>
      <p>${mergeLine}</p>
      <p><b>Replace</b> throws away what's here and uses the backup alone.</p>
      <p class="hint">Either way, you can undo it straight after, and today's earlier state stays under Data, Earlier versions.</p>`,
    foot: '<button type="button" class="btn" data-act="modal-close">Cancel</button><button type="button" class="btn danger" data-act="restore-replace">Replace everything</button><button type="button" class="btn primary" data-act="restore-merge" autofocus>Merge</button>',
    onClose: () => { ui.pendingRestore = null; },
  });
}
function replaceState(s, next) {
  for (const k of Object.keys(s)) delete s[k];
  Object.assign(s, next);
}
function applyRestore(next, exported, msg) {
  snapshotBefore('Before restoring a backup');
  next.settings.lastBackup = exported || new Date().toISOString();
  next.settings.changes = 0;
  commit(s => { replaceState(s, next); runRecurring(s); }, msg, [], { raw: true });
  nfCache.clear(); applyTheme(); render();
  offerReview();
}
ACT['restore-replace'] = el => {
  const p = ui.pendingRestore;
  if (!p) return;
  el.closest('dialog')?.close('ok');
  applyRestore(p.next, p.exported, 'Backup restored. It replaced what was here.');
};
ACT['restore-merge'] = el => {
  const p = ui.pendingRestore;
  if (!p) return;
  el.closest('dialog')?.close('ok');
  snapshotBefore('Before merging a backup');
  const keep = { lastBackup: state.settings.lastBackup, changes: state.settings.changes };
  const st = p.stats;
  const did = [st.added && `${st.added} added`, st.updated && `${st.updated} updated`, st.removed && `${st.removed} removed`].filter(Boolean).join(', ');
  commit(s => { replaceState(s, p.merged); Object.assign(s.settings, keep); runRecurring(s); }, `Backup merged${did ? `: ${did}` : '. Nothing new'}.`, [], { raw: true });
  offerReview();
};

/* ---------- earlier versions ---------- */
function snapshotList() {
  const todayKey = 'd:' + today();
  return store.snaps.filter(x => x.key !== todayKey).sort((a, b) => {
    const ta = a.key.startsWith('d:') ? toDate(a.key.slice(2)).getTime() + DAY_MS - 1 : a.at;
    const tb = b.key.startsWith('d:') ? toDate(b.key.slice(2)).getTime() + DAY_MS - 1 : b.at;
    return tb - ta;
  });
}
function snapshotLabel(x) {
  if (x.key.startsWith('d:')) return `End of ${fmtDayAuto(x.key.slice(2))}`;
  const d = new Date(x.at);
  return `${x.label || 'Before a change'}, ${fmtDayAuto(ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()))} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
ACT['snap-restore'] = async el => {
  const x = store.snaps.find(s => s.key === el.dataset.key);
  if (!x) return;
  const ok = await confirmModal({
    title: 'Go back to this version?',
    body: `Everything here now (${plural(state.tx.length, 'entry', 'entries')}) will be replaced by how things stood at: ${esc(snapshotLabel(x))}, with ${plural(x.n, 'entry', 'entries')}. You can undo it straight after.`,
    ok: 'Go back to it',
  });
  if (!ok) return;
  let next;
  try { next = normalizeState(JSON.parse(await idbRun('snaps', 'readonly', s => s.get(x.key)))); }
  catch { toast("That version couldn't be read."); return; }
  snapshotBefore('Before going back to an earlier version');
  const keep = { lastBackup: state.settings.lastBackup };
  commit(s => { replaceState(s, next); Object.assign(s.settings, keep); runRecurring(s); }, 'Went back to the earlier version.', [], { raw: true });
  nfCache.clear(); applyTheme(); render();
};

/* =========================================================================
   Review: pairs of entries that would count money twice.
     - duplicates: something you typed (or a recurring payment) that also
       came in from a bank statement
     - transfers: money leaving one of your accounts and arriving in another
   Nothing is changed until you confirm a pair.
   ========================================================================= */
let reviewCache = { rev: -1, pairs: null };
const acctKey = t => (t.acct ? 'a:' + t.acct : t.batch ? 'b:' + t.batch : '');
function acctName(t) {
  if (t.acct) { const a = state.accounts.find(x => x.id === t.acct); if (a) return a.name; }
  if (t.batch) { const b = state.imports.find(x => x.id === t.batch); if (b) return b.file; }
  return '';
}

function reviewPairs() {
  if (reviewCache.rev === dataRev && reviewCache.pairs) return reviewCache.pairs;
  const dismissed = new Set(state.dismissed);
  const dups = [], transfers = [];
  const push = (map, k, v) => { if (!map.has(k)) map.set(k, []); map.get(k).push(v); };

  /* duplicates: yours vs imported, same direction and amount, bank date -3..+7 days from yours */
  const imported = new Map();
  for (const t of state.tx) if (t.src === 'import') push(imported, `${t.type}|${t.amount}`, t);
  const cand = [];
  for (const m of state.tx) {
    if (m.src === 'import' || m.src === 'demo' || m.bk) continue;
    for (const i of imported.get(`${m.type}|${m.amount}`) || []) {
      const d = daysBetween(m.date, i.date);
      if (d < (m.rid ? -7 : -3) || d > 7) continue;
      const key = `d:${m.id}|${i.id}`;
      if (!dismissed.has(key)) cand.push({ kind: 'd', a: m, b: i, key, score: d >= 0 ? d : 0.5 - d });
    }
  }
  cand.sort((x, y) => x.score - y.score);
  const used = new Set();
  for (const p of cand) {
    if (used.has(p.a.id) || used.has(p.b.id)) continue;
    used.add(p.a.id); used.add(p.b.id);
    dups.push(p);
  }

  /* transfers: out of one account, into another, same amount, within 3 days */
  const ins = new Map();
  for (const t of state.tx) {
    if (t.type !== 'income' || used.has(t.id) || !acctKey(t)) continue;
    const k = cat(t.cat).kind;
    if (k === 'auto' || k === 'transfer') push(ins, t.amount, t);
  }
  const tc = [];
  for (const e of state.tx) {
    if (e.type !== 'expense' || used.has(e.id) || !acctKey(e)) continue;
    const ek = cat(e.cat).kind;
    for (const i of ins.get(e.amount) || []) {
      if (acctKey(i) === acctKey(e)) continue;
      const ik = cat(i.cat).kind;
      if (ek === 'transfer' && ik === 'transfer') continue;
      const d = Math.abs(daysBetween(e.date, i.date));
      if (d > 3) continue;
      // A payment already filed under a spending category only counts if it names the other account.
      const other = acctName(i);
      if (ek !== 'auto' && ek !== 'transfer' && !(ek === 'expense' && i.acct && other && textMatches(other, e.note))) continue;
      const key = `t:${e.id}|${i.id}`;
      if (!dismissed.has(key)) tc.push({ kind: 't', a: e, b: i, key, score: d });
    }
  }
  tc.sort((x, y) => x.score - y.score);
  const usedT = new Set();
  for (const p of tc) {
    if (usedT.has(p.a.id) || usedT.has(p.b.id)) continue;
    usedT.add(p.a.id); usedT.add(p.b.id);
    transfers.push(p);
  }
  const byDate = (x, y) => y.a.date.localeCompare(x.a.date);
  reviewCache = { rev: dataRev, pairs: { dups: dups.sort(byDate), transfers: transfers.sort(byDate) } };
  return reviewCache.pairs;
}
function reviewCount() { const p = reviewPairs(); return p.dups.length + p.transfers.length; }

/* After an import or a merge: say so if something needs a look. */
function offerReview() {
  const p = reviewPairs(), n = p.dups.length + p.transfers.length;
  if (!n) return;
  const what = [p.transfers.length && plural(p.transfers.length, 'possible transfer'), p.dups.length && plural(p.dups.length, 'possible duplicate')].filter(Boolean).join(' and ');
  toast(`${what} to check, so money isn't counted twice.`, [{ label: 'Review', run: openReviewModal }]);
}

function reviewRowHTML(t) {
  const c = cat(t.cat), inc = t.type === 'income';
  const where = t.src === 'import' ? (acctName(t) || 'Imported') : t.rid ? 'Recurring payment' : 'Typed by you';
  return `<div class="rv-row"><span class="ico" aria-hidden="true">${esc(c.icon)}</span><span class="rv-note">${esc(t.note || c.name)}<span class="rv-sub">${esc(fmtDayAuto(t.date))}, ${esc(where)}, ${esc(c.name)}</span></span><span class="rv-amt${inc ? ' in' : ''}">${money(inc ? t.amount : -t.amount, { sign: inc })}</span></div>`;
}
function reviewBodyHTML() {
  const p = reviewPairs();
  if (!p.dups.length && !p.transfers.length) return '<p>Nothing left to check.</p>';
  const section = (title, lede, list, yes, no, allLabel, allAct) => {
    if (!list.length) return '';
    const items = list.slice(0, 30).map(x => `<div class="rv-pair">${reviewRowHTML(x.a)}${reviewRowHTML(x.b)}
      <div class="rv-actions"><button type="button" class="btn sm primary" data-act="rv-yes" data-pair="${esc(x.key)}">${yes}</button><button type="button" class="btn sm" data-act="rv-no" data-pair="${esc(x.key)}">${no}</button></div></div>`).join('');
    return `<section class="rv-sec"><h3>${title}</h3><p class="hint">${lede}</p>${items}
      ${list.length > 30 ? `<p class="hint">Showing 30 of ${list.length}.</p>` : ''}
      ${list.length > 1 ? `<div class="rv-all"><button type="button" class="btn sm" data-act="${allAct}">${allLabel} (${list.length})</button></div>` : ''}</section>`;
  };
  return section('Transfers between your accounts', 'The same amount left one account and arrived in another. As a transfer, neither side counts as spending or income.', p.transfers, "It's a transfer", 'Not a transfer', 'All of these are transfers', 'rv-all-t')
    + section('The same payment twice', 'An entry you added and a row from a statement look like one payment. Keeping one removes the statement row and keeps your entry.', p.dups, 'Same payment, keep one', 'Two different payments', 'All of these are the same payment', 'rv-all-d');
}
function openReviewModal() {
  openModal({ title: 'Check for double counting', wide: true, body: `<div id="review-body">${reviewBodyHTML()}</div>`, foot: '<button type="button" class="btn" data-act="modal-close">Done</button>' });
}
function refreshReview() {
  const host = $('#review-body');
  if (host) host.innerHTML = reviewBodyHTML();
}
ACT['review-open'] = () => openReviewModal();

function transferCatId(s) {
  let c = s.categories.find(x => x.id === 'transfer' && x.kind === 'transfer') || s.categories.find(x => x.kind === 'transfer');
  if (!c) { c = { id: 'c_' + uid(), name: 'Transfers & savings', icon: '↔️', kind: 'transfer', budget: null }; s.categories.push(c); }
  return c.id;
}
function resolvePairs(list, yes) {
  if (!list.length) return;
  const kind = list[0].kind;
  if (!yes) {
    commit(s => { s.dismissed = [...s.dismissed, ...list.map(p => p.key)].slice(-3000); }, kind === 't' ? 'Left as it is.' : 'Kept both.');
  } else if (kind === 't') {
    commit(s => {
      const to = transferCatId(s), ids = new Set(list.flatMap(p => [p.a.id, p.b.id]));
      for (const t of s.tx) if (ids.has(t.id)) t.cat = to;
    }, `${plural(list.length, 'transfer')} marked. ${list.length === 1 ? 'It no longer counts' : 'They no longer count'} as spending or income.`);
  } else {
    commit(s => {
      const byId = new Map(s.tx.map(t => [t.id, t])), drop = new Set();
      for (const p of list) {
        const mine = byId.get(p.a.id), bank = byId.get(p.b.id);
        if (!mine || !bank) continue;
        mine.bk = bank.bk || dupKey(bank);
        if (bank.acct && !mine.acct) mine.acct = bank.acct;
        if (mine.cat === 'uncat' && bank.cat !== 'uncat') mine.cat = bank.cat;
        drop.add(bank.id);
      }
      s.tx = s.tx.filter(t => !drop.has(t.id));
    }, `${plural(list.length, 'duplicate')} removed.`);
  }
  refreshReview();
}
const findPair = key => { const p = reviewPairs(); return [...p.dups, ...p.transfers].find(x => x.key === key); };
ACT['rv-yes'] = el => { const p = findPair(el.dataset.pair); if (p) resolvePairs([p], true); };
ACT['rv-no'] = el => { const p = findPair(el.dataset.pair); if (p) resolvePairs([p], false); };
ACT['rv-all-t'] = () => resolvePairs(reviewPairs().transfers, true);
ACT['rv-all-d'] = () => resolvePairs(reviewPairs().dups, true);

/* =========================================================================
   Start-up
   ========================================================================= */
/* Ask the browser to keep this app's storage even when space runs low.
   store.persisted: true = protected, false = may be cleared, null = unknown. */
let persistAsked = false;
store.persisted = null;
async function checkPersisted() {
  try { store.persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; }
  catch { store.persisted = null; }
  return store.persisted;
}
async function askPersist(force = false) {
  if (!(navigator.storage && navigator.storage.persist)) return null;
  if (!force && (persistAsked || !state.tx.length)) return store.persisted;
  persistAsked = true;
  try {
    const was = store.persisted;
    store.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    if (was !== store.persisted && ui.tab === 'data') render();
  } catch { /* not supported here */ }
  return store.persisted;
}

/* "#add" (the home-screen shortcut) opens the new-entry form straight away. */
function handleAddShortcut() {
  if (!ui.wantAdd) return;
  ui.wantAdd = false;
  try { history.replaceState(null, '', location.pathname + location.search + '#overview'); } catch { /* fine */ }
  if (!document.querySelector('dialog[open]')) openEntryModal();
}

async function boot() {
  state = await loadState();
  reindex();
  if (runRecurring(state) || store.resync) persist();
  applyTheme();
  route();
  render();
  handleAddShortcut();
  getDownloads();
  if (WEB_APP && HOSTED && !inClaude()) {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => { /* offline mode unavailable */ });
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderBanners(); });
    window.addEventListener('appinstalled', () => { installEvt = null; renderBanners(); });
    checkPersisted().then(() => askPersist()).then(() => { if (ui.tab === 'data') render(); });
  }
  let lastDay = today();
  window.addEventListener('hashchange', () => { route(); hideTip(); render(); window.scrollTo(0, 0); handleAddShortcut(); });
  window.addEventListener('storage', e => {
    if (e.key !== STORE_KEY || e.newValue == null) return;
    try { state = normalizeState(JSON.parse(e.newValue)); dataRev++; reindex(); nfCache.clear(); applyTheme(); render(); } catch { /* ignore */ }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const t = today();
    if (t !== lastDay) {
      if (monthKey(lastDay) === ui.month) ui.month = monthKey(t);
      lastDay = t;
      if (runRecurring(state)) persist();
      render();
    }
  });
}
boot().catch(err => {
  const view = document.getElementById('view');
  if (view) view.textContent = "Spend Control couldn't start. Reload the page. If it keeps happening, your entries are still on this device; bring in your latest backup after reloading. (" + (err && err.message ? err.message : err) + ')';
});

})();
</script>
